name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

permissions:
  contents: write

jobs:

  analyze-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Download project
        uses: actions/checkout@v4

      # ==========================================================
      # 2. FETCH JOBS FROM APIFY
      # ==========================================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import concurrent.futures

          TOKEN = os.environ.get("APIFY_API_TOKEN")

          if not TOKEN:
              raise RuntimeError(
                  "APIFY_API_TOKEN secret is missing."
              )

          ACTOR_ID = "blackfalcondata~naukrigulf-scraper"

          BASE_URL = "https://api.apify.com/v2"

          # ------------------------------------------------------
          # SEARCHES
          # ------------------------------------------------------

          searches = [

              ("Chemical Engineer", "Saudi Arabia"),
              ("Chemical Engineer", "United Arab Emirates"),
              ("Chemical Engineer", "Qatar"),
              ("Chemical Engineer", "Oman"),
              ("Chemical Engineer", "Kuwait"),
              ("Chemical Engineer", "Bahrain"),

              ("Process Engineer", "Saudi Arabia"),
              ("Process Engineer", "United Arab Emirates"),
              ("Process Engineer", "Qatar"),
              ("Process Engineer", "Oman"),
              ("Process Engineer", "Kuwait"),
              ("Process Engineer", "Bahrain"),

              ("Production Engineer", "Saudi Arabia"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Engineer", "Qatar"),
              ("Production Engineer", "Oman"),
              ("Production Engineer", "Kuwait"),
              ("Production Engineer", "Bahrain"),

              ("Petrochemical Engineer", "Saudi Arabia"),
              ("Petrochemical Engineer", "United Arab Emirates"),
              ("Petrochemical Engineer", "Qatar"),

          ]

          # ------------------------------------------------------
          # HTTP HELPER
          # ------------------------------------------------------

          def request_json(url, method="GET", payload=None):

              headers = {
                  "Authorization": "Bearer " + TOKEN,
                  "Content-Type": "application/json"
              }

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  raw = response.read().decode("utf-8")

                  return json.loads(raw)

          # ------------------------------------------------------
          # START ONE APIFY RUN
          # ------------------------------------------------------

          def start_search(search):

              query, location = search

              print(
                  f"STARTING: {query} - {location}",
                  flush=True
              )

              payload = {
                  "mode": "search",
                  "query": query,
                  "location": location,

                  # Number per search
                  "maxResults": 10,

                  # Keep search fast
                  "includeDetails": False,

                  "compact": True,

                  "excludeEmptyFields": True
              }

              url = (
                  f"{BASE_URL}/acts/"
                  f"{ACTOR_ID}/runs"
              )

              result = request_json(
                  url,
                  method="POST",
                  payload=payload
              )

              run = result.get("data", {})

              run_id = run.get("id")

              dataset_id = run.get(
                  "defaultDatasetId"
              )

              if not run_id:
                  raise RuntimeError(
                      f"No run ID returned for {query} - {location}"
                  )

              print(
                  f"STARTED: {query} - {location} "
                  f"| RUN: {run_id}",
                  flush=True
              )

              return {
                  "query": query,
                  "location": location,
                  "run_id": run_id,
                  "dataset_id": dataset_id
              }

          # ------------------------------------------------------
          # START ALL SEARCHES IN PARALLEL
          # ------------------------------------------------------

          print("")
          print("=" * 70)
          print("STARTING APIFY SEARCHES")
          print("=" * 70)

          runs = []

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=8
          ) as executor:

              futures = {
                  executor.submit(
                      start_search,
                      search
                  ): search
                  for search in searches
              }

              for future in concurrent.futures.as_completed(
                  futures
              ):

                  search = futures[future]

                  try:

                      runs.append(
                          future.result()
                      )

                  except Exception as e:

                      print(
                          f"FAILED TO START: "
                          f"{search[0]} - {search[1]}"
                      )

                      print(
                          "ERROR:",
                          str(e)
                      )

          print("")
          print(
              f"STARTED RUNS: {len(runs)}"
          )

          # ------------------------------------------------------
          # WAIT FOR RUNS
          # ------------------------------------------------------

          def wait_for_run(run):

              run_id = run["run_id"]

              query = run["query"]
              location = run["location"]

              url = (
                  f"{BASE_URL}/actor-runs/"
                  f"{run_id}"
              )

              max_wait = 15 * 60

              started = time.time()

              last_status = None

              while True:

                  if time.time() - started > max_wait:

                      print(
                          f"TIMEOUT: {query} - {location}"
                      )

                      return None

                  try:

                      result = request_json(
                          url
                      )

                      data = result.get(
                          "data",
                          {}
                      )

                      status = data.get(
                          "status"
                      )

                      if status != last_status:

                          print(
                              f"STATUS: "
                              f"{query} - {location} "
                              f"=> {status}",
                              flush=True
                          )

                          last_status = status

                      if status in [
                          "SUCCEEDED",
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT"
                      ]:

                          if status != "SUCCEEDED":

                              print(
                                  f"RUN FAILED: "
                                  f"{query} - {location}"
                              )

                              return None

                          dataset_id = data.get(
                              "defaultDatasetId"
                          )

                          return {
                              "query": query,
                              "location": location,
                              "dataset_id": dataset_id
                          }

                  except Exception as e:

                      print(
                          f"Polling error "
                          f"{query} - {location}: "
                          f"{e}"
                      )

                  time.sleep(10)

          # ------------------------------------------------------
          # WAIT IN PARALLEL
          # ------------------------------------------------------

          print("")
          print("=" * 70)
          print("WAITING FOR APIFY RUNS")
          print("=" * 70)

          completed = []

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=8
          ) as executor:

              futures = [
                  executor.submit(
                      wait_for_run,
                      run
                  )
                  for run in runs
              ]

              for future in concurrent.futures.as_completed(
                  futures
              ):

                  try:

                      result = future.result()

                      if result:
                          completed.append(result)

                  except Exception as e:

                      print(
                          "WAIT ERROR:",
                          str(e)
                      )

          print("")
          print(
              f"SUCCESSFUL RUNS: "
              f"{len(completed)}"
          )

          # ------------------------------------------------------
          # DOWNLOAD DATASETS
          # ------------------------------------------------------

          all_jobs = []

          for run in completed:

              dataset_id = run.get(
                  "dataset_id"
              )

              if not dataset_id:
                  continue

              url = (
                  f"{BASE_URL}/datasets/"
                  f"{dataset_id}/items"
                  "?format=json"
                  "&clean=true"
              )

              try:

                  jobs = request_json(
                      url
                  )

                  if isinstance(
                      jobs,
                      list
                  ):

                      all_jobs.extend(
                          jobs
                      )

                      print(
                          f"DOWNLOADED: "
                          f"{run['query']} - "
                          f"{run['location']} "
                          f"=> {len(jobs)} jobs"
                      )

              except Exception as e:

                  print(
                      f"DATASET ERROR: "
                      f"{run['query']} - "
                      f"{run['location']}"
                  )

                  print(
                      str(e)
                  )

          # ------------------------------------------------------
          # DEDUPLICATION
          # ------------------------------------------------------

          unique = {}

          for job in all_jobs:

              if not isinstance(
                  job,
                  dict
              ):
                  continue

              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or job.get("job_url")
                  or ""
              )

              title = str(
                  job.get("title")
                  or ""
              ).strip().lower()

              company = str(
                  job.get("company")
                  or job.get("companyName")
                  or ""
              ).strip().lower()

              location = str(
                  job.get("location")
                  or ""
              ).strip().lower()

              if url:

                  key = url.strip().lower()

              else:

                  key = (
                      title
                      + "|"
                      + company
                      + "|"
                      + location
                  )

              if key:

                  unique[key] = job

          final_jobs = list(
              unique.values()
          )

          # ------------------------------------------------------
          # SAVE jobs.json
          # ------------------------------------------------------

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("=" * 70)
          print("FETCH SUMMARY")
          print("=" * 70)

          print(
              f"SUCCESSFUL RUNS: "
              f"{len(completed)}"
          )

          print(
              f"FAILED / TIMEOUT RUNS: "
              f"{len(runs) - len(completed)}"
          )

          print(
              f"TOTAL UNIQUE JOBS: "
              f"{len(final_jobs)}"
          )

          PY


      # ==========================================================
      # 3. ANALYZE JOBS
      # ==========================================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

          import json
          import re

          # ======================================================
          # LOAD FILES
          # ======================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)

          # ======================================================
          # PROFILE
          # ======================================================

          target_roles = [
              x.lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]

          target_countries = [
              x.lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]

          education = [
              x.lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]

          skills = [
              x.lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]

          user_experience = float(
              profile.get(
                  "experience_years",
                  1
              )
          )

          # ======================================================
          # EXPERIENCE DETECTION
          # ======================================================

          def detect_experience(text):

              text = text.lower()

              # Fresher / entry level
              fresher_patterns = [
                  r"\bfresher\b",
                  r"\bfresh graduate\b",
                  r"\bgraduate\b",
                  r"\bentry level\b",
                  r"\bentry-level\b",
                  r"\bno experience\b",
                  r"\bwithout experience\b",
                  r"\b0\s*[-to]+\s*1\s*years?\b",
                  r"\b0\s*[-to]+\s*2\s*years?\b",
                  r"\b0\s*[-to]+\s*3\s*years?\b",
                  r"\b0\s*years?\b"
              ]

              for pattern in fresher_patterns:

                  if re.search(
                      pattern,
                      text
                  ):

                      return {
                          "label": "FRESHER",
                          "fit": "EXCELLENT FIT",
                          "years": 0
                      }

              # 1-2 years
              patterns = [
                  r"(\d+)\s*[-to]+\s*(\d+)\s*years?",
                  r"(\d+)\s*years?"
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text
                  )

                  if match:

                      if len(match.groups()) >= 2:

                          minimum = int(
                              match.group(1)
                          )

                          maximum = int(
                              match.group(2)
                          )

                      else:

                          minimum = int(
                              match.group(1)
                          )

                          maximum = minimum

                      if minimum <= user_experience <= maximum:

                          return {
                              "label":
                                  f"{minimum}-{maximum} years",
                              "fit":
                                  "EXCELLENT FIT",
                              "years":
                                  minimum
                          }

                      if minimum <= 2:

                          return {
                              "label":
                                  f"{minimum}-{maximum} years",
                              "fit":
                                  "GOOD FIT",
                              "years":
                                  minimum
                          }

                      return {
                          "label":
                              f"{minimum}-{maximum} years",
                          "fit":
                              "POOR FIT",
                          "years":
                              minimum
                      }

              return {
                  "label": "Not specified",
                  "fit": "UNKNOWN",
                  "years": None
              }

          # ======================================================
          # EDUCATION MATCH
          # ======================================================

          def education_match(text):

              matches = []

              # Strong chemical / petrochemical matches
              strong_terms = [

                  "chemical engineering",
                  "chemical engineer",
                  "petrochemical engineering",
                  "petrochemical engineer",

                  "chemical technology",
                  "petrochemical",

                  "chemistry",
                  "process engineering"
              ]

              for term in strong_terms:

                  if term in text:

                      if (
                          "chemical"
                          in term
                          or "petrochemical"
                          in term
                          or "process engineering"
                          in term
                      ):

                          matches.append(
                              term
                          )

              return list(
                  dict.fromkeys(matches)
              )

          # ======================================================
          # ROLE MATCH
          # ======================================================

          def role_match(title, text):

              title_lower = title.lower()

              matches = []

              for role in target_roles:

                  role_clean = role.strip()

                  if role_clean in title_lower:

                      matches.append(
                          role_clean
                      )

              # Important related roles
              related = [
                  "chemical engineer",
                  "process engineer",
                  "production engineer",
                  "petrochemical engineer"
              ]

              for role in related:

                  if role in title_lower:

                      matches.append(
                          role
                      )

              return list(
                  dict.fromkeys(matches)
              )

          # ======================================================
          # WRONG-DISCIPLINE DETECTION
          # ======================================================

          def wrong_discipline(text):

              exclusions = [

                  "mechanical engineering",
                  "mechanical engineer",

                  "automotive engineering",
                  "automotive engineer",

                  "electrical engineering",
                  "electrical engineer",

                  "civil engineering",
                  "civil engineer",

                  "computer science",
                  "software engineer",

                  "network engineer",

                  "telecommunication engineer",

                  "structural engineer"
              ]

              found = []

              for item in exclusions:

                  if item in text:

                      found.append(
                          item
                      )

              return list(
                  dict.fromkeys(found)
              )

          # ======================================================
          # SKILL MATCH
          # ======================================================

          def skill_match(text):

              found = []

              for skill in skills:

                  skill_clean = skill.strip()

                  if skill_clean and skill_clean in text:

                      found.append(
                          skill_clean
                      )

              return list(
                  dict.fromkeys(found)
              )

          # ======================================================
          # COUNTRY MATCH
          # ======================================================

          def country_match(location):

              location = location.lower()

              for country in target_countries:

                  if country in location:

                      return True

              return False

          # ======================================================
          # SCORE
          # ======================================================

          ranked = []

          for job in jobs:

              if not isinstance(
                  job,
                  dict
              ):

                  continue

              title = str(
                  job.get("title")
                  or ""
              )

              company = str(
                  job.get("company")
                  or job.get("companyName")
                  or "Unknown"
              )

              location = str(
                  job.get("location")
                  or ""
              )

              description = str(
                  job.get("description")
                  or job.get("descriptionText")
                  or job.get("jobDescription")
                  or ""
              )

              text = (
                  title
                  + " "
                  + description
              ).lower()

              exp = detect_experience(
                  text
              )

              roles = role_match(
                  title,
                  text
              )

              education_matches = education_match(
                  text
              )

              skills_matches = skill_match(
                  text
              )

              wrong = wrong_discipline(
                  text
              )

              in_country = country_match(
                  location
              )

              score = 0
              reasons = []
              concerns = []

              # --------------------------------------------------
              # EXPERIENCE
              # --------------------------------------------------

              if exp["fit"] == "EXCELLENT FIT":

                  score += 35

                  reasons.append(
                      "Fresh graduate / entry-level experience"
                  )

              elif exp["fit"] == "GOOD FIT":

                  score += 25

                  reasons.append(
                      "Experience requirement is close"
                  )

              elif exp["fit"] == "UNKNOWN":

                  score += 10

                  concerns.append(
                      "Experience not confirmed"
                  )

              else:

                  score -= 20

                  concerns.append(
                      "Experience requirement is above target"
                  )

              # --------------------------------------------------
              # ROLE
              # --------------------------------------------------

              if roles:

                  score += 25

                  reasons.append(
                      "Target role matches"
                  )

              else:

                  concerns.append(
                      "Target role not clearly matched"
                  )

              # --------------------------------------------------
              # EDUCATION
              # --------------------------------------------------

              if education_matches:

                  score += 20

                  reasons.append(
                      "Chemical / petrochemical education matches"
                  )

              else:

                  concerns.append(
                      "Education match not confirmed"
                  )

              # --------------------------------------------------
              # SKILLS
              # --------------------------------------------------

              if skills_matches:

                  skill_points = min(
                      15,
                      len(skills_matches) * 5
                  )

                  score += skill_points

                  reasons.append(
                      f"{len(skills_matches)} matching skills"
                  )

              else:

                  concerns.append(
                      "Relevant skills not found"
                  )

              # --------------------------------------------------
              # COUNTRY
              # --------------------------------------------------

              if in_country:

                  score += 5

              # --------------------------------------------------
              # WRONG DISCIPLINE
              # --------------------------------------------------

              if wrong:

                  score -= 35

                  concerns.append(
                      "Job appears focused on "
                      + ", ".join(wrong)
                  )

              # --------------------------------------------------
              # CAP SCORE
              # --------------------------------------------------

              score = max(
                  0,
                  min(
                      100,
                      score
                  )
              )

              # --------------------------------------------------
              # ACTION
              # --------------------------------------------------

              strong_entry = (
                  exp["fit"] == "EXCELLENT FIT"
                  and bool(roles)
                  and bool(education_matches)
                  and not wrong
              )

              good_entry = (
                  exp["fit"] in [
                      "EXCELLENT FIT",
                      "GOOD FIT"
                  ]
                  and bool(roles)
                  and not wrong
              )

              if strong_entry and score >= 80:

                  action = "APPLY NOW"

                  action_text = (
                      "Apply immediately. "
                      "Strong entry-level match."
                  )

              elif good_entry and score >= 65:

                  action = "APPLY"

                  action_text = (
                      "Apply. Good match "
                      "for your profile."
                  )

              elif score >= 50 and not wrong:

                  action = "REVIEW"

                  action_text = (
                      "Review full description "
                      "before applying."
                  )

              elif score >= 35:

                  action = "LOW PRIORITY"

                  action_text = (
                      "Low priority. Apply only "
                      "if stronger jobs are unavailable."
                  )

              else:

                  action = "SKIP"

                  action_text = (
                      "Skip. Weak match "
                      "for your profile."
                  )

              # --------------------------------------------------
              # URL
              # --------------------------------------------------

              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or job.get("job_url")
                  or ""
              )

              ranked.append({

                  "score": score,
                  "action": action,

                  "title": title,
                  "company": company,
                  "location": location,

                  "experience": exp["label"],
                  "experience_fit": exp["fit"],

                  "role_match": roles,
                  "education_match":
                      education_matches,

                  "skills_match":
                      skills_matches,

                  "action_reason":
                      action_text,

                  "reasons":
                      reasons,

                  "concerns":
                      concerns,

                  "url": url,

                  "original_job":
                      job
              })

          # ======================================================
          # SORT
          # ======================================================

          action_order = {
              "APPLY NOW": 0,
              "APPLY": 1,
              "REVIEW": 2,
              "LOW PRIORITY": 3,
              "SKIP": 4
          }

          ranked.sort(
              key=lambda x: (
                  action_order.get(
                      x["action"],
                      9
                  ),
                  -x["score"]
              )
          )

          # ======================================================
          # SAVE RANKED JSON
          # ======================================================

          with open(
              "ranked_jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  ranked,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ======================================================
          # PRINT RESULTS
          # ======================================================

          print("")
          print("=" * 70)
          print("             RANKED JOBS")
          print("=" * 70)

          for index, job in enumerate(
              ranked[:20],
              1
          ):

              print("")
              print(
                  f"#{index} "
                  f"{job['score']}/100 - "
                  f"{job['action']}"
              )

              print(
                  "JOB:",
                  job["title"]
              )

              print(
                  "COMPANY:",
                  job["company"]
              )

              print(
                  "LOCATION:",
                  job["location"]
              )

              print(
                  "EXPERIENCE:",
                  job["experience"]
              )

              print(
                  "EXPERIENCE FIT:",
                  job["experience_fit"]
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      job["role_match"]
                  )
                  if job["role_match"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      job["education_match"]
                  )
                  if job["education_match"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      job["skills_match"]
                  )
                  if job["skills_match"]
                  else "None"
              )

              print(
                  "ACTION:",
                  job["action_reason"]
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      job["concerns"]
                  )
                  if job["concerns"]
                  else "None"
              )

              print(
                  "URL:",
                  job["url"]
              )

              print(
                  "-" * 70
              )

          # ======================================================
          # SUMMARY
          # ======================================================

          counts = {
              "APPLY NOW": 0,
              "APPLY": 0,
              "REVIEW": 0,
              "LOW PRIORITY": 0,
              "SKIP": 0
          }

          for job in ranked:

              action = job["action"]

              if action in counts:

                  counts[action] += 1

          print("")
          print("=" * 70)
          print("FINAL SUMMARY")
          print("=" * 70)

          print(
              "TOTAL JOBS:",
              len(ranked)
          )

          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )

          print(
              "APPLY:",
              counts["APPLY"]
          )

          print(
              "REVIEW:",
              counts["REVIEW"]
          )

          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )

          print(
              "SKIP:",
              counts["SKIP"]
          )

          print("")
          print(
              "MAIN PRIORITY:"
          )

          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )

          print("")
          print(
              "TARGET COUNTRIES:"
          )

          for country in target_countries:

              print(
                  country.title()
              )

          PY


      # ==========================================================
      # 4. SAVE RESULTS TO GITHUB
      # ==========================================================
      - name: Save analysis results
        run: |

          git config user.name "Gulf Jobs AI Agent"

          git config user.email \
            "actions@github.com"

          git add jobs.json ranked_jobs.json

          git diff --cached --quiet || \
            git commit \
              -m "Update Gulf jobs and analysis results"

          git push
