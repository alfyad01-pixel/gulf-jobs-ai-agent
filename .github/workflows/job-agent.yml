name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================

      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH JOBS - FAST MODE
      # ==========================================

      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error


          ACTOR_URL = (
              "https://api.apify.com/v2/actors/"
              "blackfalcondata~naukrigulf-scraper/"
              "run-sync-get-dataset-items"
          )


          # ======================================
          # IMPORTANT
          # ======================================
          # Only high-value searches.
          # The analyzer will filter the results
          # for fresh graduates / junior jobs.
          # ======================================

          searches = [

              # ----------------------------------
              # Saudi Arabia
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "Saudi Arabia"),
              ("Process Engineer Junior Graduate", "Saudi Arabia"),
              ("Production Engineer Junior Graduate", "Saudi Arabia"),
              ("Production Operator Fresher", "Saudi Arabia"),

              # ----------------------------------
              # UAE
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "United Arab Emirates"),
              ("Process Engineer Junior Graduate", "United Arab Emirates"),
              ("Production Engineer Junior Graduate", "United Arab Emirates"),
              ("Production Operator Fresher", "United Arab Emirates"),

              # ----------------------------------
              # Qatar
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "Qatar"),
              ("Process Engineer Junior Graduate", "Qatar"),
              ("Production Engineer Junior Graduate", "Qatar"),
              ("Production Operator Fresher", "Qatar"),

              # ----------------------------------
              # Oman
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "Oman"),
              ("Process Engineer Junior Graduate", "Oman"),
              ("Production Engineer Junior Graduate", "Oman"),

              # ----------------------------------
              # Kuwait
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "Kuwait"),
              ("Process Engineer Junior Graduate", "Kuwait"),
              ("Production Engineer Junior Graduate", "Kuwait"),

              # ----------------------------------
              # Bahrain
              # ----------------------------------

              ("Chemical Engineer Junior Graduate", "Bahrain"),
              ("Process Engineer Junior Graduate", "Bahrain"),
              ("Production Engineer Junior Graduate", "Bahrain")
          ]


          all_jobs = []


          # ======================================
          # FETCH
          # ======================================

          total = len(searches)


          for number, (query, location) in enumerate(
              searches,
              1
          ):

              print("")
              print(
                  f"[{number}/{total}] "
                  f"{query} - {location}"
              )


              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  # Do not request huge result sets
                  "maxResults": 3,

                  "includeDetails": False,

                  "compact": True,

                  "excludeEmptyFields": True
              }


              request = urllib.request.Request(

                  ACTOR_URL,

                  data=json.dumps(
                      payload
                  ).encode("utf-8"),

                  method="POST",

                  headers={

                      "Content-Type":
                          "application/json",

                      "Authorization":
                          "Bearer "
                          + os.environ[
                              "APIFY_API_TOKEN"
                          ]
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=310
                  ) as response:

                      result = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )


                  if isinstance(result, list):

                      all_jobs.extend(result)

                      print(
                          "Jobs received:",
                          len(result)
                      )

                  else:

                      print(
                          "No jobs returned"
                      )


              except urllib.error.HTTPError as e:

                  print(
                      "Search failed:",
                      query,
                      "-",
                      location
                  )

                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )


              except Exception as e:

                  print(
                      "Search error:",
                      str(e)
                  )


          # ======================================
          # REMOVE DUPLICATES
          # ======================================

          unique = {}


          for job in all_jobs:

              key = (

                  job.get("url")

                  or job.get("jobUrl")

                  or (

                      str(
                          job.get(
                              "title",
                              ""
                          )
                      )

                      + "|"

                      + str(
                          job.get(
                              "company",
                              ""
                          )
                      )

                      + "|"

                      + str(
                          job.get(
                              "location",
                              ""
                          )
                      )
                  )
              )


              unique[key] = job


          # ======================================
          # SAVE
          # ======================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  list(unique.values()),
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "================================"
          )

          print(
              "TOTAL UNIQUE JOBS:",
              len(unique)
          )

          print(
              "================================"
          )

          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================

      - name: Analyze jobs
        run: |

          echo "========================================"
          echo "       GULF JOBS AI AGENT"
          echo "       FRESH GRADUATE MODE"
          echo "================================"


          python - <<'PY'

          import json
          import re
          from urllib.parse import unquote


          # ======================================
          # LOAD PROFILE
          # ======================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [
              str(x).lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          countries = [
              str(x).lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]


          education = [
              str(x).lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


          skills = [
              str(x).lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          # ======================================
          # TEXT
          # ======================================

          def text_value(value):

              if isinstance(value, list):

                  return " ".join(
                      str(x)
                      for x in value
                  )

              if isinstance(value, dict):

                  return " ".join(
                      str(x)
                      for x in value.values()
                  )

              return str(value)


          def job_text(job):

              return " ".join(

                  text_value(v)

                  for v in job.values()

              ).lower()


          # ======================================
          # EXPERIENCE FROM URL
          # ======================================

          def experience_from_url(job):

              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              )


              url = unquote(
                  url
              ).lower()


              patterns = [

                  r"(\d+)[-_ ]*to[-_ ]*(\d+)[-_ ]*years?",

                  r"(\d+)[-_ ]*[-–][-_ ]*(\d+)[-_ ]*years?",

                  r"(\d+)[-_ ]*years?"
              ]


              for pattern in patterns:

                  match = re.search(
                      pattern,
                      url
                  )


                  if match:

                      values = match.groups()


                      if len(values) == 2:

                          return (
                              int(values[0]),
                              int(values[1]),
                              "URL"
                          )


                      return (
                          int(values[0]),
                          int(values[0]),
                          "URL"
                      )


              return None


          # ======================================
          # EXPERIENCE FROM TEXT
          # ======================================

          def experience_from_text(text):

              patterns = [

                  r"\b(\d+)\s*[-–]\s*(\d+)\s*years?",

                  r"\b(\d+)\s*to\s*(\d+)\s*years?",

                  r"\b(\d+)\s*\+\s*years?",

                  r"(?:minimum|min\.?|at least)\s*(\d+)\s*years?"
              ]


              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text
                  )


                  if match:

                      values = match.groups()


                      if len(values) == 2:

                          return (
                              int(values[0]),
                              int(values[1]),
                              "TEXT"
                          )


                      value = int(
                          values[0]
                      )


                      return (
                          value,
                          value,
                          "TEXT"
                      )


              return None


          # ======================================
          # EXPERIENCE ANALYSIS
          # ======================================

          def analyze_experience(
              job,
              text
          ):

              fresh_words = [

                  "fresh graduate",
                  "fresh graduates",
                  "fresher",
                  "freshers",
                  "entry level",
                  "entry-level",
                  "graduate trainee",
                  "graduate engineer",
                  "graduate program",
                  "graduate programme",
                  "trainee engineer",
                  "new graduate",
                  "recent graduate",
                  "no experience",
                  "without experience",
                  "zero experience"
              ]


              for word in fresh_words:

                  if word in text:

                      return {

                          "low": 0,
                          "high": 0,

                          "points": 40,

                          "level":
                              "FRESH GRADUATE",

                          "reason":
                              "Fresh graduate / entry level",

                          "source":
                              "TEXT"
                      }


              exp = experience_from_url(
                  job
              )


              if not exp:

                  exp = experience_from_text(
                      text
                  )


              if not exp:

                  return {

                      "low": None,
                      "high": None,

                      "points": 25,

                      "level":
                          "NOT SPECIFIED",

                      "reason":
                          "Experience not specified",

                      "source":
                          "NONE"
                  }


              low, high, source = exp


              if high == 0:

                  return {

                      "low": low,
                      "high": high,

                      "points": 40,

                      "level":
                          "NO EXPERIENCE",

                      "reason":
                          "No experience required",

                      "source":
                          source
                  }


              if low == 0 and high <= 1:

                  return {

                      "low": low,
                      "high": high,

                      "points": 40,

                      "level":
                          "EXCELLENT FIT",

                      "reason":
                          "0-1 years",

                      "source":
                          source
                  }


              if low == 0 and high <= 2:

                  return {

                      "low": low,
                      "high": high,

                      "points": 38,

                      "level":
                          "EXCELLENT FIT",

                      "reason":
                          "0-2 years",

                      "source":
                          source
                  }


              if low <= 1 and high <= 2:

                  return {

                      "low": low,
                      "high": high,

                      "points": 35,

                      "level":
                          "VERY GOOD FIT",

                      "reason":
                          "1-2 years",

                      "source":
                          source
                  }


              if low <= 1 and high <= 3:

                  return {

                      "low": low,
                      "high": high,

                      "points": 30,

                      "level":
                          "GOOD FIT",

                      "reason":
                          "Up to 3 years",

                      "source":
                          source
                  }


              if low <= 2 and high <= 3:

                  return {

                      "low": low,
                      "high": high,

                      "points": 22,

                      "level":
                          "POSSIBLE",

                      "reason":
                          "2-3 years",

                      "source":
                          source
                  }


              if low <= 2 and high <= 4:

                  return {

                      "low": low,
                      "high": high,

                      "points": 15,

                      "level":
                          "LOW FIT",

                      "reason":
                          "2-4 years",

                      "source":
                          source
                  }


              return {

                  "low": low,
                  "high": high,

                  "points": 0,

                  "level":
                      "NOT SUITABLE",

                  "reason":
                      "Requires more experience",

                  "source":
                      source
              }


          # ======================================
          # ROLE
          # ======================================

          def role_match(title):

              title = title.lower()


              exact = []


              for role in roles:

                  if role in title:

                      exact.append(
                          role
                      )


              if exact:

                  return 25, exact


              related_words = [

                  "chemical",
                  "process",
                  "production",
                  "petrochemical",
                  "operator",
                  "operations"
              ]


              related = [

                  x

                  for x in related_words

                  if x in title
              ]


              if related:

                  return 15, related


              return 0, []


          # ======================================
          # SENIOR
          # ======================================

          def is_senior(
              title,
              text
          ):

              senior_words = [

                  "senior",

                  "principal engineer",

                  "lead engineer",

                  "chief engineer",

                  "engineering manager",

                  "project manager",

                  "department manager",

                  "supervisor"
              ]


              if any(
                  x in title
                  for x in senior_words
              ):

                  return True


              strong = [

                  "5+ years",
                  "7+ years",
                  "10+ years",
                  "minimum 5 years",
                  "minimum 7 years",
                  "minimum 10 years"
              ]


              return any(
                  x in text
                  for x in strong
              )


          # ======================================
          # ANALYZE
          # ======================================

          results = []


          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )


              text = job_text(
                  job
              )


              exp = analyze_experience(
                  job,
                  text
              )


              role_points, role_matches = (
                  role_match(
                      title
                  )
              )


              education_matches = [

                  x

                  for x in education

                  if x in text
              ]


              education_points = (
                  15
                  if education_matches
                  else 0
              )


              skill_matches = [

                  x

                  for x in skills

                  if x in text
              ]


              skill_points = min(

                  15,

                  len(
                      skill_matches
                  ) * 3
              )


              country_matches = [

                  x

                  for x in countries

                  if x in text
              ]


              country_points = (
                  5
                  if country_matches
                  else 0
              )


              title_bonus = 0


              junior_words = [

                  "junior",
                  "graduate",
                  "trainee",
                  "entry level",
                  "entry-level",
                  "assistant",
                  "operator"
              ]


              if any(
                  x in title.lower()
                  for x in junior_words
              ):

                  title_bonus = 5


              fresh_bonus = (

                  5

                  if exp["level"]
                  in [
                      "FRESH GRADUATE",
                      "NO EXPERIENCE",
                      "EXCELLENT FIT"
                  ]

                  else 0
              )


              score = (

                  exp["points"]

                  + role_points

                  + education_points

                  + skill_points

                  + country_points

                  + title_bonus

                  + fresh_bonus
              )


              score = min(
                  100,
                  score
              )


              senior = is_senior(
                  title,
                  text
              )


              if senior:

                  score = min(
                      score,
                      35
                  )

                  decision = "SKIP"

              elif exp["points"] == 0:

                  decision = "SKIP"

              elif score >= 80:

                  decision = "APPLY NOW"

              elif score >= 70:

                  decision = "APPLY"

              elif score >= 55:

                  decision = "REVIEW"

              elif score >= 40:

                  decision = "LOW PRIORITY"

              else:

                  decision = "SKIP"


              reasons = []


              if exp["reason"]:

                  reasons.append(
                      exp["reason"]
                  )


              if role_points >= 25:

                  reasons.append(
                      "Target role matches"
                  )


              elif role_points >= 15:

                  reasons.append(
                      "Related role"
                  )


              if education_matches:

                  reasons.append(
                      "Education matches"
                  )


              if skill_matches:

                  reasons.append(

                      f"{len(skill_matches)} "
                      "matching skills"
                  )


              concerns = []


              if (
                  exp["level"]
                  == "NOT SPECIFIED"
              ):

                  concerns.append(
                      "Experience must be verified"
                  )


              if (
                  exp["level"]
                  in [
                      "LOW FIT",
                      "NOT SUITABLE"
                  ]
              ):

                  concerns.append(
                      exp["reason"]
                  )


              if not education_matches:

                  concerns.append(
                      "Education match not confirmed"
                  )


              if senior:

                  concerns.append(
                      "Senior position"
                  )


              results.append({

                  "score":
                      score,

                  "decision":
                      decision,

                  "job":
                      job,

                  "experience":
                      exp,

                  "role_matches":
                      role_matches,

                  "education_matches":
                      education_matches,

                  "skill_matches":
                      skill_matches,

                  "reasons":
                      reasons,

                  "concerns":
                      concerns
              })


          # ======================================
          # SORT
          # ======================================

          order = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1
          }


          results.sort(

              key=lambda x: (

                  order[
                      x["decision"]
                  ],

                  x["score"]
              ),

              reverse=True
          )


          # ======================================
          # OUTPUT
          # ======================================

          print("")
          print(
              "========================================"
          )

          print(
              "              RANKED JOBS"
          )

          print(
              "========================================"
          )


          for rank, item in enumerate(
              results,
              1
          ):

              job = item["job"]

              exp = item[
                  "experience"
              ]


              print("")

              print(
                  f"#{rank} "
                  f"{item['score']}/100 "
                  f"- {item['decision']}"
              )


              print(
                  "JOB:",
                  job.get(
                      "title",
                      "Unknown"
                  )
              )


              print(
                  "COMPANY:",
                  job.get(
                      "company",
                      "Unknown"
                  )
              )


              print(
                  "LOCATION:",
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or "Unknown"
              )


              if exp["low"] is None:

                  exp_display = (
                      "Not specified"
                  )

              elif exp["low"] == exp["high"]:

                  exp_display = (
                      f"{exp['low']} years"
                  )

              else:

                  exp_display = (

                      f"{exp['low']}-"
                      f"{exp['high']} years"
                  )


              print(
                  "EXPERIENCE:",
                  exp_display
              )


              print(
                  "EXPERIENCE FIT:",
                  exp["level"]
              )


              print(
                  "EXPERIENCE SOURCE:",
                  exp["source"]
              )


              print(
                  "WHY:",
                  "; ".join(
                      item["reasons"]
                  )
                  if item["reasons"]
                  else "None"
              )


              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )


              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["role_matches"]
                  )
                  if item["role_matches"]
                  else "None"
              )


              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["education_matches"]
                  )
                  if item["education_matches"]
                  else "None"
              )


              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["skill_matches"]
                  )
                  if item["skill_matches"]
                  else "None"
              )


              print(
                  "URL:",
                  job.get("url")
                  or job.get("jobUrl")
                  or "No URL"
              )


              print(
                  "----------------------------------------"
              )


          # ======================================
          # SUMMARY
          # ======================================

          counts = {

              "APPLY NOW": 0,

              "APPLY": 0,

              "REVIEW": 0,

              "LOW PRIORITY": 0,

              "SKIP": 0
          }


          for item in results:

              counts[
                  item["decision"]
              ] += 1


          print("")
          print(
              "========================================"
          )

          print(
              "              FINAL SUMMARY"
          )

          print(
              "========================================"
          )


          print(
              "TOTAL JOBS:",
              len(results)
          )


          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )


          print(
              "APPLY:",
              counts["APPLY"]
          )


          print(
              "REVIEW:",
              counts["REVIEW"]
          )


          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )


          print(
              "SKIP:",
              counts["SKIP"]
          )


          print("")
          print(
              "MAIN PRIORITY:"
          )


          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / Junior / "
              "0-1 / 0-2 years"
          )


          print("")
          print(
              "TARGET COUNTRIES:"
          )


          print(
              "Saudi Arabia | UAE | Qatar | "
              "Oman | Kuwait | Bahrain"
          )


          print(
              "========================================"
          )

          PY
