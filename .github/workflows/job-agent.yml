name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    # حماية إضافية: لا تسمح للـWorkflow كله بالعمل أكثر من 30 دقيقة
    timeout-minutes: 30

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH JOBS FROM APIFY
      # ==========================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error


          TOKEN = os.environ["APIFY_API_TOKEN"]

          BASE = "https://api.apify.com/v2"

          ACTOR = "blackfalcondata~naukrigulf-scraper"


          # =====================================================
          # SETTINGS
          # =====================================================

          # أقصى مدة ننتظرها لكل Actor
          MAX_RUN_SECONDS = 240

          # أقصى مدة إجمالية لكل عملية Fetch
          MAX_TOTAL_SECONDS = 1200

          # عدد النتائج لكل بحث
          MAX_RESULTS = 15


          # =====================================================
          # SEARCHES
          # =====================================================

          searches = [

              ("Saudi Arabia", "Chemical Engineer"),
              ("Saudi Arabia", "Process Engineer"),
              ("Saudi Arabia", "Production Engineer"),

              ("United Arab Emirates", "Chemical Engineer"),
              ("United Arab Emirates", "Process Engineer"),
              ("United Arab Emirates", "Production Engineer"),

              ("Qatar", "Chemical Engineer"),
              ("Qatar", "Process Engineer"),
              ("Qatar", "Production Engineer"),

              ("Oman", "Chemical Engineer"),
              ("Oman", "Process Engineer"),
              ("Oman", "Production Engineer"),

              ("Kuwait", "Chemical Engineer"),
              ("Kuwait", "Process Engineer"),
              ("Kuwait", "Production Engineer"),

              ("Bahrain", "Chemical Engineer"),
              ("Bahrain", "Process Engineer"),
              ("Bahrain", "Production Engineer")

          ]


          # =====================================================
          # API REQUEST
          # =====================================================

          def api_request(
              url,
              method="GET",
              payload=None,
              timeout=30
          ):

              headers = {
                  "Authorization":
                      "Bearer " + TOKEN
              }

              data = None

              if payload is not None:

                  data = json.dumps(
                      payload
                  ).encode("utf-8")

                  headers[
                      "Content-Type"
                  ] = "application/json"


              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )


              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  return json.loads(
                      response
                      .read()
                      .decode("utf-8")
                  )


          # =====================================================
          # START
          # =====================================================

          all_jobs = []

          workflow_start = time.time()

          successful_runs = 0

          failed_runs = 0


          print("")
          print("==========================================")
          print("       GULF JOB FETCHER")
          print("==========================================")


          # =====================================================
          # RUN EACH SEARCH
          # =====================================================

          for index, (location, query) in enumerate(
              searches,
              1
          ):

              # -----------------------------------------------
              # GLOBAL TIME LIMIT
              # -----------------------------------------------

              elapsed = (
                  time.time()
                  - workflow_start
              )


              if elapsed >= MAX_TOTAL_SECONDS:

                  print("")
                  print(
                      "GLOBAL FETCH TIME LIMIT REACHED"
                  )

                  break


              print("")
              print(
                  f"[{index}/{len(searches)}]"
              )

              print(
                  "SEARCH:",
                  query
              )

              print(
                  "LOCATION:",
                  location
              )


              # =================================================
              # START ACTOR
              # =================================================

              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  "maxResults": MAX_RESULTS,

                  "includeDetails": True,

                  "compact": False,

                  "excludeEmptyFields": True

              }


              start_url = (
                  BASE
                  + "/actors/"
                  + ACTOR
                  + "/runs"
              )


              try:

                  result = api_request(
                      start_url,
                      method="POST",
                      payload=payload,
                      timeout=30
                  )


                  data = result.get(
                      "data",
                      {}
                  )


                  run_id = data.get(
                      "id"
                  )


                  dataset_id = data.get(
                      "defaultDatasetId"
                  )


                  if not run_id:

                      print(
                          "START FAILED: no run ID"
                      )

                      failed_runs += 1

                      continue


                  print(
                      "RUN:",
                      run_id
                  )


              except Exception as e:

                  print(
                      "START ERROR:",
                      str(e)
                  )

                  failed_runs += 1

                  continue


              # =================================================
              # WAIT FOR ACTOR
              # =================================================

              run_start = time.time()

              final_status = None


              while True:

                  elapsed_run = (
                      time.time()
                      - run_start
                  )


                  # ---------------------------------------------
                  # TIMEOUT PER RUN
                  # ---------------------------------------------

                  if elapsed_run >= MAX_RUN_SECONDS:

                      print(
                          "RUN TIMEOUT:",
                          run_id
                      )


                      # -----------------------------------------
                      # ABORT ACTOR
                      # -----------------------------------------

                      try:

                          abort_url = (
                              BASE
                              + "/actor-runs/"
                              + run_id
                              + "/abort"
                          )


                          api_request(
                              abort_url,
                              method="POST",
                              timeout=20
                          )


                          print(
                              "RUN ABORTED"
                          )


                      except Exception as e:

                          print(
                              "ABORT ERROR:",
                              str(e)
                          )


                      failed_runs += 1

                      break


                  # ---------------------------------------------
                  # CHECK STATUS
                  # ---------------------------------------------

                  try:

                      status_url = (
                          BASE
                          + "/actor-runs/"
                          + run_id
                          + "?waitForFinish=15"
                      )


                      result = api_request(
                          status_url,
                          timeout=25
                      )


                      data = result.get(
                          "data",
                          {}
                      )


                      status = data.get(
                          "status"
                      )


                      if data.get(
                          "defaultDatasetId"
                      ):

                          dataset_id = data.get(
                              "defaultDatasetId"
                          )


                      print(
                          "STATUS:",
                          status
                      )


                      # -----------------------------------------
                      # SUCCESS
                      # -----------------------------------------

                      if status == "SUCCEEDED":

                          final_status = status

                          successful_runs += 1

                          print(
                              "RUN SUCCEEDED"
                          )

                          break


                      # -----------------------------------------
                      # FAILED
                      # -----------------------------------------

                      if status in [
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT"
                      ]:

                          final_status = status

                          failed_runs += 1

                          print(
                              "RUN FAILED:",
                              status
                          )

                          break


                  except Exception as e:

                      print(
                          "STATUS ERROR:",
                          str(e)
                      )


                  time.sleep(5)


              # =================================================
              # GET DATASET
              # =================================================

              if final_status != "SUCCEEDED":

                  continue


              if not dataset_id:

                  print(
                      "NO DATASET"
                  )

                  continue


              print(
                  "DOWNLOADING DATA..."
              )


              dataset_url = (
                  BASE
                  + "/datasets/"
                  + dataset_id
                  + "/items?format=json"
              )


              try:

                  result = api_request(
                      dataset_url,
                      timeout=60
                  )


                  if isinstance(
                      result,
                      list
                  ):

                      print(
                          "JOBS:",
                          len(result)
                      )

                      all_jobs.extend(
                          result
                      )


              except Exception as e:

                  print(
                      "DATASET ERROR:",
                      str(e)
                  )


          # =====================================================
          # DEDUPLICATION
          # =====================================================

          print("")
          print("==========================================")
          print("DEDUPLICATING JOBS")
          print("==========================================")


          unique = {}


          for job in all_jobs:

              if not isinstance(
                  job,
                  dict
              ):

                  continue


              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              ).strip().lower()


              title = str(
                  job.get("title")
                  or ""
              ).strip().lower()


              company = str(
                  job.get("company")
                  or ""
              ).strip().lower()


              location = str(
                  job.get("location")
                  or ""
              ).strip().lower()


              if url:

                  key = url

              else:

                  key = (
                      title
                      + "|"
                      + company
                      + "|"
                      + location
                  )


              if key:

                  unique[key] = job


          jobs = list(
              unique.values()
          )


          # =====================================================
          # SAVE
          # =====================================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # SUMMARY
          # =====================================================

          print("")
          print("==========================================")
          print("FETCH SUMMARY")
          print("==========================================")

          print(
              "SUCCESSFUL RUNS:",
              successful_runs
          )

          print(
              "FAILED / TIMEOUT RUNS:",
              failed_runs
          )

          print(
              "TOTAL UNIQUE JOBS:",
              len(jobs)
          )

          print("")

          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

          import json
          import re


          # =====================================================
          # LOAD
          # =====================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [
              str(x).lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          skills = [
              str(x).lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          education = [
              str(x).lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


          # =====================================================
          # NORMALIZE
          # =====================================================

          def normalize(text):

              text = str(
                  text or ""
              ).lower()

              text = text.replace(
                  "–",
                  "-"
              )

              text = text.replace(
                  "—",
                  "-"
              )

              return text


          # =====================================================
          # ALL JOB TEXT
          # =====================================================

          def all_text(job):

              values = []

              for value in job.values():

                  if value is not None:

                      values.append(
                          str(value)
                      )


              return normalize(
                  " ".join(values)
              )


          # =====================================================
          # EXPERIENCE DETECTOR
          # =====================================================

          def detect_experience(job):

              text = all_text(job)


              # -----------------------------------------------
              # FRESHER
              # -----------------------------------------------

              if re.search(
                  r"\bfresh\s+graduate\b",
                  text
              ):

                  return (
                      "Fresh Graduate",
                      "EXCELLENT FIT",
                      45
                  )


              if re.search(
                  r"\bfresher\b",
                  text
              ):

                  return (
                      "Fresher",
                      "EXCELLENT FIT",
                      45
                  )


              if re.search(
                  r"\bentry[- ]level\b",
                  text
              ):

                  return (
                      "Entry Level",
                      "EXCELLENT FIT",
                      45
                  )


              # -----------------------------------------------
              # RANGES
              # -----------------------------------------------

              ranges = re.findall(
                  r"\b(\d+)\s*(?:to|-)\s*(\d+)\s*(?:years?|yrs?)\b",
                  text
              )


              if ranges:

                  low = int(
                      ranges[0][0]
                  )

                  high = int(
                      ranges[0][1]
                  )


                  if low == 0 and high <= 2:

                      return (
                          f"{low}-{high} years",
                          "EXCELLENT FIT",
                          45
                      )


                  if low == 1 and high <= 2:

                      return (
                          f"{low}-{high} years",
                          "EXCELLENT FIT",
                          42
                      )


                  if low == 1 and high <= 3:

                      return (
                          f"{low}-{high} years",
                          "GOOD FIT",
                          32
                      )


                  if low >= 2 and high <= 4:

                      return (
                          f"{low}-{high} years",
                          "LOW FIT",
                          8
                      )


                  if low >= 3:

                      return (
                          f"{low}-{high} years",
                          "POOR FIT",
                          0
                      )


              # -----------------------------------------------
              # PLUS
              # -----------------------------------------------

              plus = re.findall(
                  r"\b(\d+)\s*\+\s*(?:years?|yrs?)\b",
                  text
              )


              if plus:

                  years = int(
                      plus[0]
                  )


                  if years <= 2:

                      return (
                          f"{years}+ years",
                          "GOOD FIT",
                          25
                      )


                  if years <= 3:

                      return (
                          f"{years}+ years",
                          "PARTIAL FIT",
                          10
                      )


                  return (
                      f"{years}+ years",
                      "POOR FIT",
                      0
                  )


              # -----------------------------------------------
              # EXACT
              # -----------------------------------------------

              if re.search(
                  r"\b1\s*(?:year|years|yr|yrs)\b",
                  text
              ):

                  return (
                      "1 year",
                      "EXCELLENT FIT",
                      40
                  )


              if re.search(
                  r"\b2\s*(?:year|years|yr|yrs)\b",
                  text
              ):

                  return (
                      "2 years",
                      "GOOD FIT",
                      30
                  )


              # -----------------------------------------------
              # NO EXPERIENCE
              # -----------------------------------------------

              if re.search(
                  r"no\s+experience"
                  r"|experience\s+not\s+required",
                  text
              ):

                  return (
                      "No experience required",
                      "EXCELLENT FIT",
                      45
                  )


              return (
                  "Not specified",
                  "UNKNOWN",
                  10
              )


          # =====================================================
          # ROLE
          # =====================================================

          def get_roles(title):

              title = normalize(
                  title
              )

              return [
                  role
                  for role in roles
                  if role in title
              ]


          # =====================================================
          # EDUCATION
          # =====================================================

          def get_education(text):

              matches = []


              if (
                  "chemical engineer" in text
                  or "chemical engineering" in text
              ):

                  if (
                      "chemical engineering"
                      in education
                  ):

                      matches.append(
                          "chemical engineering"
                      )


              if (
                  "petrochemical"
                  in text
              ):

                  if (
                      "petrochemical engineering"
                      in education
                  ):

                      matches.append(
                          "petrochemical engineering"
                      )


              if (
                  "process engineer"
                  in text
              ):

                  if (
                      "chemical engineering"
                      in education
                  ):

                      if (
                          "chemical engineering"
                          not in matches
                      ):

                          matches.append(
                              "chemical engineering"
                          )


              if (
                  "production engineer"
                  in text
              ):

                  if (
                      "chemical engineering"
                      in education
                  ):

                      if (
                          "chemical engineering"
                          not in matches
                      ):

                          matches.append(
                              "chemical engineering"
                          )


              return matches


          # =====================================================
          # ANALYSIS
          # =====================================================

          results = []


          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )


              company = str(
                  job.get(
                      "company",
                      ""
                  )
              )


              location = str(
                  job.get(
                      "location",
                      ""
                  )
              )


              description = str(
                  job.get(
                      "description"
                  )
                  or job.get(
                      "descriptionText"
                  )
                  or ""
              )


              url = str(
                  job.get(
                      "url"
                  )
                  or job.get(
                      "jobUrl"
                  )
                  or ""
              )


              text = normalize(
                  title
                  + " "
                  + description
                  + " "
                  + url
              )


              # -----------------------------------------------
              # EXPERIENCE
              # -----------------------------------------------

              experience, exp_fit, exp_score = (
                  detect_experience(job)
              )


              # -----------------------------------------------
              # ROLE
              # -----------------------------------------------

              matched_roles = get_roles(
                  title
              )


              role_score = (
                  25
                  if matched_roles
                  else 0
              )


              # -----------------------------------------------
              # EDUCATION
              # -----------------------------------------------

              matched_education = get_education(
                  text
              )


              education_score = (
                  15
                  if matched_education
                  else 0
              )


              # -----------------------------------------------
              # SKILLS
              # -----------------------------------------------

              matched_skills = [
                  skill
                  for skill in skills
                  if skill in text
              ]


              skill_score = min(
                  15,
                  len(matched_skills) * 5
              )


              # -----------------------------------------------
              # SCORE
              # -----------------------------------------------

              score = min(
                  100,
                  exp_score
                  + role_score
                  + education_score
                  + skill_score
              )


              # =================================================
              # DECISION
              # =================================================

              if exp_fit == "POOR FIT":

                  decision = "SKIP"


              elif exp_fit == "LOW FIT":

                  decision = (
                      "LOW PRIORITY"
                      if score >= 55
                      else "SKIP"
                  )


              elif (
                  exp_fit == "EXCELLENT FIT"
                  and matched_roles
                  and matched_education
                  and score >= 70
              ):

                  decision = "APPLY NOW"


              elif (
                  exp_fit in [
                      "EXCELLENT FIT",
                      "GOOD FIT"
                  ]
                  and matched_roles
                  and score >= 60
              ):

                  decision = "APPLY"


              elif score >= 50:

                  decision = "REVIEW"


              elif score >= 35:

                  decision = "LOW PRIORITY"


              else:

                  decision = "SKIP"


              # =================================================
              # CONCERNS
              # =================================================

              concerns = []


              if exp_fit == "UNKNOWN":

                  concerns.append(
                      "Experience not confirmed"
                  )


              if exp_fit in [
                  "LOW FIT",
                  "POOR FIT"
              ]:

                  concerns.append(
                      "Experience requirement above target"
                  )


              if not matched_roles:

                  concerns.append(
                      "Target role not confirmed"
                  )


              if not matched_education:

                  concerns.append(
                      "Education match not confirmed"
                  )


              if not matched_skills:

                  concerns.append(
                      "Relevant skills not found"
                  )


              # =================================================
              # ACTION
              # =================================================

              if decision == "APPLY NOW":

                  action = (
                      "Apply immediately. "
                      "Strong entry-level match."
                  )


              elif decision == "APPLY":

                  action = (
                      "Apply. "
                      "Good match for your experience."
                  )


              elif decision == "REVIEW":

                  action = (
                      "Review the full description "
                      "before applying."
                  )


              elif decision == "LOW PRIORITY":

                  action = (
                      "Keep as backup. "
                      "Prioritize stronger jobs first."
                  )


              else:

                  action = (
                      "Skip. "
                      "Focus on better entry-level jobs."
                  )


              results.append({

                  "score": score,

                  "decision": decision,

                  "title": title,

                  "company": company,

                  "location": location,

                  "experience": experience,

                  "experience_fit": exp_fit,

                  "matched_roles": matched_roles,

                  "matched_education": matched_education,

                  "matched_skills": matched_skills,

                  "action": action,

                  "concerns": concerns,

                  "url": url

              })


          # =====================================================
          # SORT
          # =====================================================

          priority = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1

          }


          results.sort(
              key=lambda x: (
                  priority[
                      x["decision"]
                  ],
                  x["score"]
              ),
              reverse=True
          )


          # =====================================================
          # SAVE
          # =====================================================

          with open(
              "ranked_jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # PRINT TOP 20
          # =====================================================

          print("")
          print("==========================================")
          print("              RANKED JOBS")
          print("==========================================")


          for i, item in enumerate(
              results[:20],
              1
          ):

              print("")
              print(
                  f"#{i}",
                  item["score"],
                  "/100 -",
                  item["decision"]
              )

              print(
                  "JOB:",
                  item["title"]
              )

              print(
                  "COMPANY:",
                  item["company"]
              )

              print(
                  "LOCATION:",
                  item["location"]
              )

              print(
                  "EXPERIENCE:",
                  item["experience"]
              )

              print(
                  "EXPERIENCE FIT:",
                  item["experience_fit"]
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["matched_roles"]
                  )
                  if item["matched_roles"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["matched_education"]
                  )
                  if item["matched_education"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["matched_skills"]
                  )
                  if item["matched_skills"]
                  else "None"
              )

              print(
                  "ACTION:",
                  item["action"]
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )

              print(
                  "URL:",
                  item["url"]
              )

              print(
                  "------------------------------------------"
              )


          # =====================================================
          # FINAL SUMMARY
          # =====================================================

          counts = {
              "APPLY NOW": 0,
              "APPLY": 0,
              "REVIEW": 0,
              "LOW PRIORITY": 0,
              "SKIP": 0
          }


          for item in results:

              counts[
                  item["decision"]
              ] += 1


          print("")
          print("==========================================")
          print("              FINAL SUMMARY")
          print("==========================================")


          print(
              "TOTAL JOBS:",
              len(results)
          )


          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )


          print(
              "APPLY:",
              counts["APPLY"]
          )


          print(
              "REVIEW:",
              counts["REVIEW"]
          )


          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )


          print(
              "SKIP:",
              counts["SKIP"]
          )


          print("")
          print(
              "MAIN PRIORITY:"
          )


          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )


          print("")
          print(
              "TARGET COUNTRIES:"
          )


          print(
              "Saudi Arabia | UAE | Qatar | "
              "Oman | Kuwait | Bahrain"
          )

          PY


      # ==========================================
      # 4. VERIFY OUTPUT
      # ==========================================
      - name: Verify output
        run: |

          echo "================================"
          echo "OUTPUT FILES"
          echo "================================"

          ls -lh \
            jobs.json \
            ranked_jobs.json

          echo ""

          python - <<'PY'

          import json

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "ranked_jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              ranked = json.load(f)


          print(
              "JOBS:",
              len(jobs)
          )

          print(
              "RANKED:",
              len(ranked)
          )

          PY
