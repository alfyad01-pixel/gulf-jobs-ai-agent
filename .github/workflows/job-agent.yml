name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

permissions:
  contents: write

jobs:

  analyze-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Download project
        uses: actions/checkout@v4


      # ==========================================================
      # 2. FETCH JOBS FROM APIFY
      # ==========================================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import concurrent.futures

          TOKEN = os.environ.get("APIFY_API_TOKEN")

          if not TOKEN:
              raise RuntimeError(
                  "APIFY_API_TOKEN secret is missing."
              )

          ACTOR_ID = "blackfalcondata~naukrigulf-scraper"

          BASE_URL = "https://api.apify.com/v2"

          # ------------------------------------------------------
          # SEARCHES
          # ------------------------------------------------------

          searches = [

              ("Chemical Engineer", "Saudi Arabia"),
              ("Chemical Engineer", "United Arab Emirates"),
              ("Chemical Engineer", "Qatar"),
              ("Chemical Engineer", "Oman"),
              ("Chemical Engineer", "Kuwait"),
              ("Chemical Engineer", "Bahrain"),

              ("Process Engineer", "Saudi Arabia"),
              ("Process Engineer", "United Arab Emirates"),
              ("Process Engineer", "Qatar"),
              ("Process Engineer", "Oman"),
              ("Process Engineer", "Kuwait"),
              ("Process Engineer", "Bahrain"),

              ("Production Engineer", "Saudi Arabia"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Engineer", "Qatar"),
              ("Production Engineer", "Oman"),
              ("Production Engineer", "Kuwait"),
              ("Production Engineer", "Bahrain"),

              ("Petrochemical Engineer", "Saudi Arabia"),
              ("Petrochemical Engineer", "United Arab Emirates"),
              ("Petrochemical Engineer", "Qatar"),

          ]

          # ------------------------------------------------------
          # HTTP HELPER
          # ------------------------------------------------------

          def request_json(url, method="GET", payload=None):

              headers = {
                  "Authorization": "Bearer " + TOKEN,
                  "Content-Type": "application/json"
              }

              data = None

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=60
              ) as response:

                  raw = response.read().decode("utf-8")

                  return json.loads(raw)

          # ------------------------------------------------------
          # START ONE APIFY RUN
          # ------------------------------------------------------

          def start_search(search):

              query, location = search

              print(
                  f"STARTING: {query} - {location}",
                  flush=True
              )

              payload = {
                  "mode": "search",
                  "query": query,
                  "location": location,
                  "maxResults": 10,
                  "includeDetails": False,
                  "compact": True,
                  "excludeEmptyFields": True
              }

              url = (
                  f"{BASE_URL}/acts/"
                  f"{ACTOR_ID}/runs"
              )

              result = request_json(
                  url,
                  method="POST",
                  payload=payload
              )

              run = result.get("data", {})

              run_id = run.get("id")

              if not run_id:
                  raise RuntimeError(
                      f"No run ID returned for "
                      f"{query} - {location}"
                  )

              print(
                  f"STARTED: {query} - {location} "
                  f"| RUN: {run_id}",
                  flush=True
              )

              return {
                  "query": query,
                  "location": location,
                  "run_id": run_id
              }

          # ------------------------------------------------------
          # START ALL SEARCHES IN PARALLEL
          # ------------------------------------------------------

          print("")
          print("=" * 70)
          print("STARTING APIFY SEARCHES")
          print("=" * 70)

          runs = []

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=8
          ) as executor:

              futures = {
                  executor.submit(
                      start_search,
                      search
                  ): search
                  for search in searches
              }

              for future in concurrent.futures.as_completed(
                  futures
              ):

                  search = futures[future]

                  try:

                      runs.append(
                          future.result()
                      )

                  except Exception as e:

                      print(
                          f"FAILED TO START: "
                          f"{search[0]} - {search[1]}"
                      )

                      print(
                          "ERROR:",
                          str(e)
                      )

          print("")
          print(
              f"STARTED RUNS: {len(runs)}"
          )

          # ------------------------------------------------------
          # WAIT FOR RUN
          # ------------------------------------------------------

          def wait_for_run(run):

              run_id = run["run_id"]

              query = run["query"]
              location = run["location"]

              url = (
                  f"{BASE_URL}/actor-runs/"
                  f"{run_id}"
              )

              max_wait = 15 * 60

              started = time.time()

              last_status = None

              while True:

                  if time.time() - started > max_wait:

                      print(
                          f"TIMEOUT: "
                          f"{query} - {location}"
                      )

                      return None

                  try:

                      result = request_json(
                          url
                      )

                      data = result.get(
                          "data",
                          {}
                      )

                      status = data.get(
                          "status"
                      )

                      if status != last_status:

                          print(
                              f"STATUS: "
                              f"{query} - {location} "
                              f"=> {status}",
                              flush=True
                          )

                          last_status = status

                      if status in [
                          "SUCCEEDED",
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT"
                      ]:

                          if status != "SUCCEEDED":

                              print(
                                  f"RUN FAILED: "
                                  f"{query} - {location}"
                              )

                              return None

                          dataset_id = data.get(
                              "defaultDatasetId"
                          )

                          return {
                              "query": query,
                              "location": location,
                              "dataset_id": dataset_id
                          }

                  except Exception as e:

                      print(
                          f"Polling error "
                          f"{query} - {location}: "
                          f"{e}"
                      )

                  time.sleep(10)

          # ------------------------------------------------------
          # WAIT IN PARALLEL
          # ------------------------------------------------------

          print("")
          print("=" * 70)
          print("WAITING FOR APIFY RUNS")
          print("=" * 70)

          completed = []

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=8
          ) as executor:

              futures = [
                  executor.submit(
                      wait_for_run,
                      run
                  )
                  for run in runs
              ]

              for future in concurrent.futures.as_completed(
                  futures
              ):

                  try:

                      result = future.result()

                      if result:
                          completed.append(result)

                  except Exception as e:

                      print(
                          "WAIT ERROR:",
                          str(e)
                      )

          print("")
          print(
              f"SUCCESSFUL RUNS: "
              f"{len(completed)}"
          )

          # ------------------------------------------------------
          # DOWNLOAD DATASETS
          # ------------------------------------------------------

          all_jobs = []

          for run in completed:

              dataset_id = run.get(
                  "dataset_id"
              )

              if not dataset_id:
                  continue

              url = (
                  f"{BASE_URL}/datasets/"
                  f"{dataset_id}/items"
                  "?format=json"
                  "&clean=true"
              )

              try:

                  jobs = request_json(
                      url
                  )

                  if isinstance(
                      jobs,
                      list
                  ):

                      all_jobs.extend(
                          jobs
                      )

                      print(
                          f"DOWNLOADED: "
                          f"{run['query']} - "
                          f"{run['location']} "
                          f"=> {len(jobs)} jobs"
                      )

              except Exception as e:

                  print(
                      f"DATASET ERROR: "
                      f"{run['query']} - "
                      f"{run['location']}"
                  )

                  print(
                      str(e)
                  )

          # ------------------------------------------------------
          # DEDUPLICATION
          # ------------------------------------------------------

          unique = {}

          for job in all_jobs:

              if not isinstance(
                  job,
                  dict
              ):
                  continue

              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or job.get("job_url")
                  or ""
              )

              title = str(
                  job.get("title")
                  or ""
              ).strip().lower()

              company = str(
                  job.get("company")
                  or job.get("companyName")
                  or ""
              ).strip().lower()

              location = str(
                  job.get("location")
                  or ""
              ).strip().lower()

              if url:

                  key = url.strip().lower()

              else:

                  key = (
                      title
                      + "|"
                      + company
                      + "|"
                      + location
                  )

              if key:

                  unique[key] = job

          final_jobs = list(
              unique.values()
          )

          # ------------------------------------------------------
          # SAVE jobs.json
          # ------------------------------------------------------

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  final_jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print("=" * 70)
          print("FETCH SUMMARY")
          print("=" * 70)

          print(
              f"SUCCESSFUL RUNS: "
              f"{len(completed)}"
          )

          print(
              f"FAILED / TIMEOUT RUNS: "
              f"{len(runs) - len(completed)}"
          )

          print(
              f"TOTAL UNIQUE JOBS: "
              f"{len(final_jobs)}"
          )

          PY


      # ==========================================================
      # 3. ANALYZE JOBS
      # ==========================================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

          import json
          import re

          # ======================================================
          # LOAD FILES
          # ======================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)

          # ======================================================
          # PROFILE
          # ======================================================

          target_roles = [
              x.lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]

          target_countries = [
              x.lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]

          education = [
              x.lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]

          skills = [
              x.lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]

          user_experience = float(
              profile.get(
                  "experience_years",
                  1
              )
          )

          # ======================================================
          # EXPERIENCE DETECTION
          # ======================================================

          def detect_experience(text):

              text = text.lower()

              fresher_patterns = [
                  r"\bfresher\b",
                  r"\bfresh graduate\b",
                  r"\bgraduate\b",
                  r"\bentry level\b",
                  r"\bentry-level\b",
                  r"\bno experience\b",
                  r"\bwithout experience\b",
                  r"\b0\s*(?:-|to)\s*1\s*years?\b",
                  r"\b0\s*(?:-|to)\s*2\s*years?\b",
                  r"\b0\s*(?:-|to)\s*3\s*years?\b",
                  r"\b0\s*years?\b"
              ]

              for pattern in fresher_patterns:

                  if re.search(
                      pattern,
                      text
                  ):

                      return {
                          "label": "FRESHER",
                          "fit": "EXCELLENT FIT",
                          "years": 0
                      }

              patterns = [
                  r"(\d+)\s*(?:-|to)\s*(\d+)\s*years?",
                  r"(\d+)\s*years?"
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text
                  )

                  if match:

                      if len(match.groups()) >= 2:

                          minimum = int(
                              match.group(1)
                          )

                          maximum = int(
                              match.group(2)
                          )

                      else:

                          minimum = int(
                              match.group(1)
                          )

                          maximum = minimum

                      if minimum <= user_experience <= maximum:

                          return {
                              "label":
                                  f"{minimum}-{maximum} years",
                              "fit":
                                  "EXCELLENT FIT",
                              "years":
                                  minimum
                          }

                      if minimum <= 2:

                          return {
                              "label":
                                  f"{minimum}-{maximum} years",
                              "fit":
                                  "GOOD FIT",
                              "years":
                                  minimum
                          }

                      return {
                          "label":
                              f"{minimum}-{maximum} years",
                          "fit":
                              "POOR FIT",
                          "years":
                              minimum
                      }

              return {
                  "label": "Not specified",
                  "fit": "UNKNOWN",
                  "years": None
              }

          # ======================================================
          # EDUCATION MATCH
          # ======================================================

          def education_match(text):

              matches = []

              strong_terms = [
                  "chemical engineering",
                  "chemical engineer",
                  "petrochemical engineering",
                  "petrochemical engineer",
                  "chemical technology",
                  "petrochemical",
                  "chemistry",
                  "process engineering"
              ]

              for term in strong_terms:

                  if term in text:

                      matches.append(
                          term
                      )

              return list(
                  dict.fromkeys(matches)
              )

          # ======================================================
          # ROLE MATCH
          # ======================================================

          def role_match(title, text):

              title_lower = title.lower()

              matches = []

              for role in target_roles:

                  role_clean = role.strip()

                  if role_clean in title_lower:

                      matches.append(
                          role_clean
                      )

              related = [
                  "chemical engineer",
                  "process engineer",
                  "production engineer",
                  "petrochemical engineer"
              ]

              for role in related:

                  if role in title_lower:

                      matches.append(
                          role
                      )

              return list(
                  dict.fromkeys(matches)
              )

          # ======================================================
          # WRONG-DISCIPLINE DETECTION
          # ======================================================

          def wrong_discipline(text):

              exclusions = [

                  "mechanical engineering",
                  "mechanical engineer",

                  "automotive engineering",
                  "automotive engineer",

                  "electrical engineering",
                  "electrical engineer",

                  "civil engineering",
                  "civil engineer",

                  "computer science",
                  "software engineer",

                  "network engineer",

                  "telecommunication engineer",

                  "structural engineer"
              ]

              found = []

              for item in exclusions:

                  if item in text:

                      found.append(
                          item
                      )

              return list(
                  dict.fromkeys(found)
              )

          # ======================================================
          # SKILL MATCH
          # ======================================================

          def skill_match(text):

              found = []

              for skill in skills:

                  skill_clean = skill.strip()

                  if skill_clean and skill_clean in text:

                      found.append(
                          skill_clean
                      )

              return list(
                  dict.fromkeys(found)
              )

          # ======================================================
          # COUNTRY MATCH
          # ======================================================

          def country_match(location):

              location = location.lower()

              for country in target_countries:

                  if country in location:

                      return True

              return False

          # ======================================================
          # SCORE
          # ======================================================

          ranked = []

          for job in jobs:

              if not isinstance(
                  job,
                  dict
              ):

                  continue

              title = str(
                  job.get("title")
                  or ""
              )

              company = str(
                  job.get("company")
                  or job.get("companyName")
                  or "Unknown"
              )

              location = str(
                  job.get("location")
                  or ""
              )

              description = str(
                  job.get("description")
                  or job.get("descriptionText")
                  or job.get("jobDescription")
                  or ""
              )

              text = (
                  title
                  + " "
                  + description
              ).lower()

              exp = detect_experience(
                  text
              )

              roles = role_match(
                  title,
                  text
              )

              education_matches = education_match(
                  text
              )

              skills_matches = skill_match(
                  text
              )

              wrong = wrong_discipline(
                  text
              )

              in_country = country_match(
                  location
              )

              score = 0

              reasons = []

              concerns = []

              # --------------------------------------------------
              # EXPERIENCE
              # --------------------------------------------------

              if exp["fit"] == "EXCELLENT FIT":

                  score += 35

                  reasons.append(
                      "Fresh graduate / entry-level experience"
                  )

              elif exp["fit"] == "GOOD FIT":

                  score += 25

                  reasons.append(
                      "Experience requirement is close"
                  )

              elif exp["fit"] == "UNKNOWN":

                  score += 10

                  concerns.append(
                      "Experience not confirmed"
                  )

              else:

                  score -= 20

                  concerns.append(
                      "Experience requirement is above target"
                  )

              # --------------------------------------------------
              # ROLE
              # --------------------------------------------------

              if roles:

                  score += 25

                  reasons.append(
                      "Target role matches"
                  )

              else:

                  concerns.append(
                      "Target role not clearly matched"
                  )

              # --------------------------------------------------
              # EDUCATION
              # --------------------------------------------------

              if education_matches:

                  score += 20

                  reasons.append(
                      "Chemical / petrochemical education matches"
                  )

              else:

                  concerns.append(
                      "Education match not confirmed"
                  )

              # --------------------------------------------------
              # SKILLS
              # --------------------------------------------------

              if skills_matches:

                  skill_points = min(
                      15,
                      len(skills_matches) * 5
                  )

                  score += skill_points

                  reasons.append(
                      f"{len(skills_matches)} matching skills"
                  )

              else:

                  concerns.append(
                      "Relevant skills not found"
                  )

              # --------------------------------------------------
              # COUNTRY
              # --------------------------------------------------

              if in_country:

                  score += 5

              # --------------------------------------------------
              # WRONG DISCIPLINE
              # --------------------------------------------------

              if wrong:

                  score -= 35

                  concerns.append(
                      "Job appears focused on "
                      + ", ".join(wrong)
                  )

              # --------------------------------------------------
              # CAP SCORE
              # --------------------------------------------------

              score = max(
                  0,
                  min(
                      100,
                      score
                  )
              )

              # --------------------------------------------------
              # ACTION
              # --------------------------------------------------

              strong_entry = (
                  exp["fit"] == "EXCELLENT FIT"
                  and bool(roles)
                  and bool(education_matches)
                  and not wrong
              )

              good_entry = (
                  exp["fit"] in [
                      "EXCELLENT FIT",
                      "GOOD FIT"
                  ]
                  and bool(roles)
                  and not wrong
              )

              if strong_entry and score >= 80:

                  action = "APPLY NOW"

                  action_text = (
                      "Apply immediately. "
                      "Strong entry-level match."
                  )

              elif good_entry and score >= 65:

                  action = "APPLY"

                  action_text = (
                      "Apply. Good match "
                      "for your profile."
                  )

              elif score >= 50 and not wrong:

                  action = "REVIEW"

                  action_text = (
                      "Review full description "
                      "before applying."
                  )

              elif score >= 35:

                  action = "LOW PRIORITY"

                  action_text = (
                      "Low priority. Apply only "
                      "if stronger jobs are unavailable."
                  )

              else:

                  action = "SKIP"

                  action_text = (
                      "Skip. Weak match "
                      "for your profile."
                  )

              # --------------------------------------------------
              # URL
              # --------------------------------------------------

              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or job.get("job_url")
                  or ""
              )

              ranked.append({

                  "score": score,

                  "action": action,

                  "title": title,

                  "company": company,

                  "location": location,

                  "experience": exp["label"],

                  "experience_fit":
                      exp["fit"],

                  "role_match":
                      roles,

                  "education_match":
                      education_matches,

                  "skills_match":
                      skills_matches,

                  "action_reason":
                      action_text,

                  "reasons":
                      reasons,

                  "concerns":
                      concerns,

                  "url":
                      url,

                  "original_job":
                      job
              })

          # ======================================================
          # SORT
          # ======================================================

          action_order = {
              "APPLY NOW": 0,
              "APPLY": 1,
              "REVIEW": 2,
              "LOW PRIORITY": 3,
              "SKIP": 4
          }

          ranked.sort(
              key=lambda x: (
                  action_order.get(
                      x["action"],
                      9
                  ),
                  -x["score"]
              )
          )

          # ======================================================
          # SAVE RANKED JSON
          # ======================================================

          with open(
              "ranked_jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  ranked,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ======================================================
          # PRINT RESULTS
          # ======================================================

          print("")
          print("=" * 70)
          print("             RANKED JOBS")
          print("=" * 70)

          for index, job in enumerate(
              ranked[:20],
              1
          ):

              print("")

              print(
                  f"#{index} "
                  f"{job['score']}/100 - "
                  f"{job['action']}"
              )

              print(
                  "JOB:",
                  job["title"]
              )

              print(
                  "COMPANY:",
                  job["company"]
              )

              print(
                  "LOCATION:",
                  job["location"]
              )

              print(
                  "EXPERIENCE:",
                  job["experience"]
              )

              print(
                  "EXPERIENCE FIT:",
                  job["experience_fit"]
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      job["role_match"]
                  )
                  if job["role_match"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      job["education_match"]
                  )
                  if job["education_match"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      job["skills_match"]
                  )
                  if job["skills_match"]
                  else "None"
              )

              print(
                  "ACTION:",
                  job["action_reason"]
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      job["concerns"]
                  )
                  if job["concerns"]
                  else "None"
              )

              print(
                  "URL:",
                  job["url"]
              )

              print(
                  "-" * 70
              )

          # ======================================================
          # SUMMARY
          # ======================================================

          counts = {
              "APPLY NOW": 0,
              "APPLY": 0,
              "REVIEW": 0,
              "LOW PRIORITY": 0,
              "SKIP": 0
          }

          for job in ranked:

              action = job["action"]

              if action in counts:

                  counts[action] += 1

          print("")

          print("=" * 70)
          print("FINAL SUMMARY")
          print("=" * 70)

          print(
              "TOTAL JOBS:",
              len(ranked)
          )

          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )

          print(
              "APPLY:",
              counts["APPLY"]
          )

          print(
              "REVIEW:",
              counts["REVIEW"]
          )

          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )

          print(
              "SKIP:",
              counts["SKIP"]
          )

          print("")
          print(
              "MAIN PRIORITY:"
          )

          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )

          print("")
          print(
              "TARGET COUNTRIES:"
          )

          for country in target_countries:

              print(
                  country.title()
              )

          PY


      # ==========================================================
      # 4. CREATE JOBS DASHBOARD
      # ==========================================================
      - name: Create Jobs Dashboard
        run: |

          python - <<'PY'

          import json
          from html import escape
          from datetime import datetime, timezone

          # ======================================================
          # LOAD RANKED JOBS
          # ======================================================

          with open(
              "ranked_jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)

          if isinstance(jobs, dict):

              jobs = jobs.get(
                  "jobs",
                  []
              )

          # ======================================================
          # HELPERS
          # ======================================================

          def get_action(job):

              return str(
                  job.get(
                      "action",
                      ""
                  )
              ).upper().strip()


          def get_score(job):

              try:

                  return int(
                      job.get(
                          "score",
                          0
                      )
                  )

              except:

                  return 0


          def get_list(value):

              if isinstance(
                  value,
                  list
              ):

                  return ", ".join(
                      str(x)
                      for x in value
                  )

              return str(
                  value or ""
              )


          # ======================================================
          # COUNTS
          # ======================================================

          total = len(jobs)

          counts = {
              "APPLY NOW": sum(
                  1
                  for j in jobs
                  if get_action(j) == "APPLY NOW"
              ),

              "APPLY": sum(
                  1
                  for j in jobs
                  if get_action(j) == "APPLY"
              ),

              "REVIEW": sum(
                  1
                  for j in jobs
                  if get_action(j) == "REVIEW"
              ),

              "LOW PRIORITY": sum(
                  1
                  for j in jobs
                  if get_action(j) == "LOW PRIORITY"
              ),

              "SKIP": sum(
                  1
                  for j in jobs
                  if get_action(j) == "SKIP"
              )
          }

          # ======================================================
          # SORT
          # ======================================================

          jobs = sorted(
              jobs,
              key=get_score,
              reverse=True
          )

          # ======================================================
          # BADGE
          # ======================================================

          def badge(action):

              classes = {
                  "APPLY NOW": "apply-now",
                  "APPLY": "apply",
                  "REVIEW": "review",
                  "LOW PRIORITY": "low",
                  "SKIP": "skip"
              }

              cls = classes.get(
                  action,
                  "review"
              )

              return (
                  f'<span class="badge {cls}">'
                  f'{escape(action)}'
                  f'</span>'
              )

          # ======================================================
          # TABLE ROWS
          # ======================================================

          rows = []

          for index, job in enumerate(
              jobs,
              1
          ):

              title = escape(
                  str(
                      job.get(
                          "title",
                          "Unknown Job"
                      )
                  )
              )

              company = escape(
                  str(
                      job.get(
                          "company",
                          "Unknown"
                      )
                  )
              )

              location = escape(
                  str(
                      job.get(
                          "location",
                          "Unknown"
                      )
                  )
              )

              score = get_score(
                  job
              )

              action = get_action(
                  job
              )

              experience = escape(
                  str(
                      job.get(
                          "experience",
                          "Not specified"
                      )
                  )
              )

              experience_fit = escape(
                  str(
                      job.get(
                          "experience_fit",
                          "Unknown"
                      )
                  )
              )

              role_match = escape(
                  get_list(
                      job.get(
                          "role_match",
                          []
                      )
                  )
              )

              education_match = escape(
                  get_list(
                      job.get(
                          "education_match",
                          []
                      )
                  )
              )

              skills_match = escape(
                  get_list(
                      job.get(
                          "skills_match",
                          []
                      )
                  )
              )

              concerns = escape(
                  get_list(
                      job.get(
                          "concerns",
                          []
                      )
                  )
              )

              reason = escape(
                  str(
                      job.get(
                          "action_reason",
                          ""
                      )
                  )
              )

              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or job.get("job_url")
                  or ""
              )

              if url:

                  link = (
                      '<a class="job-link" '
                      f'href="{escape(str(url), quote=True)}" '
                      'target="_blank" '
                      'rel="noopener noreferrer">'
                      'Open Job ↗'
                      '</a>'
                  )

              else:

                  link = (
                      '<span class="no-link">'
                      'No URL'
                      '</span>'
                  )

              rows.append(
                  f"""
                  <tr data-action="{escape(action)}">

                    <td class="rank">
                      {index}
                    </td>

                    <td class="score">
                      <strong>
                        {score}
                      </strong>
                        /100
                    </td>

                    <td>
                      {badge(action)}
                    </td>

                    <td>
                      <div class="job-title">
                        {title}
                      </div>

                      <div class="company">
                        {company}
                      </div>

                      <div class="location">
                        📍 {location}
                      </div>
                    </td>

                    <td>
                      <strong>
                        {experience}
                      </strong>

                      <div class="small">
                        {experience_fit}
                      </div>
                    </td>

                    <td>
                      {role_match or "—"}
                    </td>

                    <td>
                      {education_match or "—"}
                    </td>

                    <td>
                      {skills_match or "—"}
                    </td>

                    <td class="reason">
                      {reason}
                    </td>

                    <td class="concerns">
                      {concerns or "None"}
                    </td>

                    <td>
                      {link}
                    </td>

                  </tr>
                  """
              )

          table_rows = "\n".join(
              rows
          )

          # ======================================================
          # GENERATION TIME
          # ======================================================

          generated = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          # ======================================================
          # HTML
          # ======================================================

          html = f"""
          <!DOCTYPE html>

          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>
              Gulf Jobs AI Agent Dashboard
            </title>

            <style>

              * {{
                box-sizing: border-box;
              }}

              body {{
                margin: 0;
                padding: 0;
                font-family:
                  Arial,
                  Helvetica,
                  sans-serif;
                background: #f4f6f8;
                color: #1f2937;
              }}

              .header {{
                background: #111827;
                color: white;
                padding: 28px 32px;
              }}

              .header h1 {{
                margin: 0 0 8px 0;
                font-size: 28px;
              }}

              .header p {{
                margin: 0;
                color: #d1d5db;
              }}

              .container {{
                max-width: 1800px;
                margin: 0 auto;
                padding: 25px;
              }}

              .cards {{
                display: grid;
                grid-template-columns:
                  repeat(
                    5,
                    minmax(
                      150px,
                      1fr
                    )
                  );
                gap: 15px;
                margin-bottom: 25px;
              }}

              .card {{
                background: white;
                border-radius: 12px;
                padding: 20px;
                box-shadow:
                  0 2px 8px
                  rgba(
                    0,
                    0,
                    0,
                    0.08
                  );
              }}

              .card-title {{
                font-size: 13px;
                color: #6b7280;
                text-transform: uppercase;
                font-weight: bold;
              }}

              .card-number {{
                font-size: 32px;
                font-weight: bold;
                margin-top: 8px;
              }}

              .apply-now-card {{
                border-top: 5px solid #16a34a;
              }}

              .apply-card {{
                border-top: 5px solid #2563eb;
              }}

              .review-card {{
                border-top: 5px solid #f59e0b;
              }}

              .low-card {{
                border-top: 5px solid #9333ea;
              }}

              .skip-card {{
                border-top: 5px solid #6b7280;
              }}

              .controls {{
                background: white;
                padding: 18px;
                border-radius: 12px;
                margin-bottom: 20px;
                box-shadow:
                  0 2px 8px
                  rgba(
                    0,
                    0,
                    0,
                    0.08
                  );
              }}

              .controls input,
              .controls select {{
                padding: 11px 14px;
                border: 1px solid #d1d5db;
                border-radius: 8px;
                font-size: 14px;
                margin-right: 10px;
                margin-bottom: 8px;
              }}

              .table-wrapper {{
                background: white;
                border-radius: 12px;
                overflow: auto;
                box-shadow:
                  0 2px 8px
                  rgba(
                    0,
                    0,
                    0,
                    0.08
                  );
              }}

              table {{
                width: 100%;
                border-collapse: collapse;
                min-width: 1500px;
              }}

              th {{
                background: #1f2937;
                color: white;
                padding: 14px 10px;
                text-align: left;
                font-size: 12px;
                position: sticky;
                top: 0;
                z-index: 2;
              }}

              td {{
                padding: 13px 10px;
                border-bottom:
                  1px solid #e5e7eb;
                vertical-align: top;
                font-size: 13px;
              }}

              tr:hover {{
                background: #f9fafb;
              }}

              .rank {{
                font-weight: bold;
                color: #6b7280;
              }}

              .score {{
                white-space: nowrap;
                font-size: 15px;
              }}

              .job-title {{
                font-weight: bold;
                font-size: 14px;
                margin-bottom: 5px;
              }}

              .company {{
                color: #374151;
                margin-bottom: 4px;
              }}

              .location {{
                color: #6b7280;
                font-size: 12px;
              }}

              .small {{
                color: #6b7280;
                font-size: 11px;
                margin-top: 5px;
              }}

              .badge {{
                display: inline-block;
                padding: 6px 9px;
                border-radius: 999px;
                font-size: 11px;
                font-weight: bold;
                white-space: nowrap;
              }}

              .apply-now {{
                background: #dcfce7;
                color: #166534;
              }}

              .apply {{
                background: #dbeafe;
                color: #1d4ed8;
              }}

              .review {{
                background: #fef3c7;
                color: #92400e;
              }}

              .low {{
                background: #f3e8ff;
                color: #7e22ce;
              }}

              .skip {{
                background: #e5e7eb;
                color: #374151;
              }}

              .reason {{
                min-width: 220px;
              }}

              .concerns {{
                min-width: 200px;
                color: #b45309;
              }}

              .job-link {{
                display: inline-block;
                background: #111827;
                color: white;
                text-decoration: none;
                padding: 8px 11px;
                border-radius: 7px;
                font-size: 12px;
                white-space: nowrap;
              }}

              .job-link:hover {{
                background: #374151;
              }}

              .no-link {{
                color: #9ca3af;
              }}

              .footer {{
                text-align: center;
                color: #6b7280;
                font-size: 12px;
                padding: 25px;
              }}

              @media (
                max-width: 900px
              ) {{

                .cards {{
                  grid-template-columns:
                    repeat(
                      2,
                      minmax(
                        140px,
                        1fr
                      )
                    );
                }}

                .container {{
                  padding: 12px;
                }}

                .header {{
                  padding: 22px 18px;
                }}

              }}

            </style>

          </head>

          <body>

            <div class="header">

              <h1>
                Gulf Jobs AI Agent
              </h1>

              <p>
                Chemical / Process /
                Production / Petrochemical
                Jobs Dashboard
              </p>

              <p style="margin-top:8px;">
                Generated:
                {generated}
              </p>

            </div>


            <div class="container">

              <div class="cards">

                <div class="card">
                  <div class="card-title">
                    Total Jobs
                  </div>

                  <div class="card-number">
                    {total}
                  </div>
                </div>


                <div class="card apply-now-card">
                  <div class="card-title">
                    Apply Now
                  </div>

                  <div class="card-number">
                    {counts["APPLY NOW"]}
                  </div>
                </div>


                <div class="card apply-card">
                  <div class="card-title">
                    Apply
                  </div>

                  <div class="card-number">
                    {counts["APPLY"]}
                  </div>
                </div>


                <div class="card review-card">
                  <div class="card-title">
                    Review
                  </div>

                  <div class="card-number">
                    {counts["REVIEW"]}
                  </div>
                </div>


                <div class="card skip-card">
                  <div class="card-title">
                    Skip
                  </div>

                  <div class="card-number">
                    {counts["SKIP"]}
                  </div>
                </div>

              </div>


              <div class="controls">

                <input
                  type="text"
                  id="search"
                  placeholder="Search jobs, companies, locations..."
                  onkeyup="filterJobs()"
                >

                <select
                  id="actionFilter"
                  onchange="filterJobs()"
                >

                  <option value="">
                    All Actions
                  </option>

                  <option value="APPLY NOW">
                    APPLY NOW
                  </option>

                  <option value="APPLY">
                    APPLY
                  </option>

                  <option value="REVIEW">
                    REVIEW
                  </option>

                  <option value="LOW PRIORITY">
                    LOW PRIORITY
                  </option>

                  <option value="SKIP">
                    SKIP
                  </option>

                </select>

              </div>


              <div class="table-wrapper">

                <table id="jobsTable">

                  <thead>

                    <tr>

                      <th>
                        #
                      </th>

                      <th>
                        Score
                      </th>

                      <th>
                        Action
                      </th>

                      <th>
                        Job
                      </th>

                      <th>
                        Experience
                      </th>

                      <th>
                        Role Match
                      </th>

                      <th>
                        Education
                      </th>

                      <th>
                        Skills
                      </th>

                      <th>
                        Reason
                      </th>

                      <th>
                        Concerns
                      </th>

                      <th>
                        Link
                      </th>

                    </tr>

                  </thead>

                  <tbody>

                    {table_rows}

                  </tbody>

                </table>

              </div>

            </div>


            <div class="footer">

              Gulf Jobs AI Agent
              —
              Automated Job Analysis Dashboard

            </div>


            <script>

              function filterJobs() {{

                const search =
                  document
                    .getElementById(
                      "search"
                    )
                    .value
                    .toLowerCase();

                const action =
                  document
                    .getElementById(
                      "actionFilter"
                    )
                    .value
                    .toUpperCase();

                const rows =
                  document.querySelectorAll(
                    "#jobsTable tbody tr"
                  );

                rows.forEach(
                  function(row) {{

                    const text =
                      row.textContent
                        .toLowerCase();

                    const rowAction =
                      row
                        .getAttribute(
                          "data-action"
                        )
                        .toUpperCase();

                    const searchMatch =
                      !search ||
                      text.includes(
                        search
                      );

                    const actionMatch =
                      !action ||
                      rowAction === action;

                    row.style.display =
                      (
                        searchMatch &&
                        actionMatch
                      )
                      ? ""
                      : "none";

                  }}
                );

              }}

            </script>

          </body>

          </html>
          """

          # ======================================================
          # SAVE DASHBOARD
          # ======================================================

          with open(
              "jobs-dashboard.html",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  html
              )

          print(
              "Dashboard created successfully."
          )

          print(
              "File: jobs-dashboard.html"
          )

          print(
              f"Jobs displayed: {total}"
          )

          PY


      # ==========================================================
      # 5. UPLOAD DASHBOARD
      # ==========================================================
      - name: Upload Jobs Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: gulf-jobs-dashboard
          path: jobs-dashboard.html
          retention-days: 30


      # ==========================================================
      # 6. SAVE RESULTS TO GITHUB
      # ==========================================================
      - name: Save analysis results
        run: |

          git config user.name \
            "Gulf Jobs AI Agent"

          git config user.email \
            "actions@github.com"

          git add \
            jobs.json \
            ranked_jobs.json

          git diff --cached --quiet || \
            git commit \
              -m "Update Gulf jobs and analysis results"

          git push
