name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================
      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH JOBS FROM APIFY
      # ==========================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error


          API_TOKEN = os.environ["APIFY_API_TOKEN"]

          BASE_URL = "https://api.apify.com/v2"

          ACTOR_ID = "blackfalcondata~naukrigulf-scraper"


          # =====================================================
          # SEARCHES
          # =====================================================

          searches = [

              (
                  "Saudi Arabia",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Saudi Arabia",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Saudi Arabia",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              )

          ]


          def request_api(url, method="GET", payload=None):

              headers = {
                  "Authorization": "Bearer " + API_TOKEN
              }

              data = None

              if payload is not None:

                  data = json.dumps(payload).encode("utf-8")

                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # =====================================================
          # START ACTOR RUNS
          # =====================================================

          runs = []

          print("")
          print("==========================================")
          print("STARTING APIFY RUNS")
          print("==========================================")


          for location, query in searches:

              print("")
              print("LOCATION:", location)
              print("QUERY:", query)


              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  "maxResults": 30,

                  "includeDetails": True,

                  "compact": False,

                  "excludeEmptyFields": True

              }


              url = (
                  BASE_URL
                  + "/actors/"
                  + ACTOR_ID
                  + "/runs"
              )


              try:

                  result = request_api(
                      url,
                      method="POST",
                      payload=payload
                  )

                  data = result.get(
                      "data",
                      {}
                  )

                  run_id = data.get("id")

                  dataset_id = data.get(
                      "defaultDatasetId"
                  )


                  if run_id:

                      runs.append({
                          "run_id": run_id,
                          "dataset_id": dataset_id,
                          "location": location
                      })

                      print(
                          "STARTED:",
                          run_id
                      )

              except Exception as e:

                  print(
                      "START ERROR:",
                      str(e)
                  )


          print("")
          print(
              "TOTAL RUNS:",
              len(runs)
          )


          # =====================================================
          # WAIT FOR RUNS
          # =====================================================

          pending = {
              x["run_id"]: x
              for x in runs
          }

          finished = []

          max_wait = 1200

          started = time.time()


          while pending:

              if time.time() - started > max_wait:

                  print(
                      "MAX WAIT REACHED"
                  )

                  break


              for run_id in list(pending.keys()):

                  item = pending[run_id]


                  try:

                      status_url = (
                          BASE_URL
                          + "/actor-runs/"
                          + run_id
                      )


                      result = request_api(
                          status_url
                      )


                      data = result.get(
                          "data",
                          {}
                      )


                      status = data.get(
                          "status"
                      )


                      print(
                          "RUN:",
                          run_id,
                          "STATUS:",
                          status
                      )


                      if status == "SUCCEEDED":

                          item["dataset_id"] = (
                              data.get(
                                  "defaultDatasetId"
                              )
                              or item["dataset_id"]
                          )

                          finished.append(item)

                          del pending[run_id]


                      elif status in [
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT",
                          "TIMING-OUT"
                      ]:

                          print(
                              "FAILED RUN:",
                              run_id
                          )

                          del pending[run_id]


                  except Exception as e:

                      print(
                          "STATUS ERROR:",
                          str(e)
                      )


              if pending:

                  time.sleep(15)


          # =====================================================
          # DOWNLOAD DATA
          # =====================================================

          all_jobs = []


          print("")
          print("==========================================")
          print("DOWNLOADING DATA")
          print("==========================================")


          for item in finished:

              dataset_id = item.get(
                  "dataset_id"
              )


              if not dataset_id:

                  continue


              dataset_url = (
                  BASE_URL
                  + "/datasets/"
                  + dataset_id
                  + "/items?format=json"
              )


              try:

                  result = request_api(
                      dataset_url
                  )


                  if isinstance(result, list):

                      print(
                          item["location"],
                          ":",
                          len(result),
                          "jobs"
                      )

                      all_jobs.extend(result)


              except Exception as e:

                  print(
                      "DATASET ERROR:",
                      str(e)
                  )


          # =====================================================
          # DEDUPLICATION
          # =====================================================

          unique = {}


          for job in all_jobs:

              if not isinstance(job, dict):

                  continue


              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              ).strip().lower()


              title = str(
                  job.get("title", "")
              ).strip().lower()


              company = str(
                  job.get("company", "")
              ).strip().lower()


              location = str(
                  job.get("location", "")
              ).strip().lower()


              key = (
                  url
                  if url
                  else
                  title
                  + "|"
                  + company
                  + "|"
                  + location
              )


              if key:

                  unique[key] = job


          jobs = list(
              unique.values()
          )


          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "TOTAL UNIQUE JOBS:",
              len(jobs)
          )

          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

          import json
          import re


          # =====================================================
          # LOAD PROFILE
          # =====================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [
              str(x).lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          skills = [
              str(x).lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          education = [
              str(x).lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


          countries = [
              str(x).lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]


          # =====================================================
          # NORMALIZE
          # =====================================================

          def normalize(text):

              text = str(
                  text or ""
              ).lower()

              text = text.replace(
                  "–",
                  "-"
              )

              text = text.replace(
                  "—",
                  "-"
              )

              return text


          # =====================================================
          # BUILD ALL JOB TEXT
          # =====================================================

          def get_all_text(job):

              values = []

              for key, value in job.items():

                  if value is not None:

                      values.append(
                          str(value)
                      )

              return normalize(
                  " ".join(values)
              )


          # =====================================================
          # EXPERIENCE DETECTION
          # =====================================================

          def detect_experience(job):

              # IMPORTANT:
              # We inspect ALL fields including URL.
              # This fixes cases such as:
              # 10-to-12-years
              # 5-to-10-years
              # 2-to-4-years

              all_text = get_all_text(job)


              # -------------------------------------------------
              # FRESHER
              # -------------------------------------------------

              if re.search(
                  r"\bfresh\s+graduate\b",
                  all_text
              ):

                  return (
                      "Fresh Graduate",
                      "EXCELLENT FIT",
                      45
                  )


              if re.search(
                  r"\bfresher\b|\bfreshers\b",
                  all_text
              ):

                  return (
                      "Fresher",
                      "EXCELLENT FIT",
                      45
                  )


              if re.search(
                  r"\bentry[- ]level\b",
                  all_text
              ):

                  return (
                      "Entry Level",
                      "EXCELLENT FIT",
                      45
                  )


              if re.search(
                  r"\bgraduate\s+trainee\b",
                  all_text
              ):

                  return (
                      "Graduate Trainee",
                      "EXCELLENT FIT",
                      45
                  )


              # -------------------------------------------------
              # X TO Y YEARS
              # -------------------------------------------------

              ranges = re.findall(
                  r"\b(\d+)\s*(?:to|-)\s*(\d+)\s*(?:years?|yrs?)\b",
                  all_text
              )


              if ranges:

                  # Use the first explicit range.
                  low = int(
                      ranges[0][0]
                  )

                  high = int(
                      ranges[0][1]
                  )


                  if low == 0 and high <= 1:

                      return (
                          f"{low}-{high} years",
                          "EXCELLENT FIT",
                          45
                      )


                  if low == 0 and high <= 2:

                      return (
                          f"{low}-{high} years",
                          "EXCELLENT FIT",
                          43
                      )


                  if low == 1 and high <= 2:

                      return (
                          f"{low}-{high} years",
                          "EXCELLENT FIT",
                          40
                      )


                  if low == 1 and high <= 3:

                      return (
                          f"{low}-{high} years",
                          "GOOD FIT",
                          30
                      )


                  if low == 2 and high <= 3:

                      return (
                          f"{low}-{high} years",
                          "PARTIAL FIT",
                          15
                      )


                  if low >= 2 and high <= 4:

                      return (
                          f"{low}-{high} years",
                          "LOW FIT",
                          5
                      )


                  if low >= 3:

                      return (
                          f"{low}-{high} years",
                          "POOR FIT",
                          0
                      )


              # -------------------------------------------------
              # X+ YEARS
              # -------------------------------------------------

              plus_matches = re.findall(
                  r"\b(\d+)\s*\+\s*(?:years?|yrs?)\b",
                  all_text
              )


              if plus_matches:

                  years = int(
                      plus_matches[0]
                  )


                  if years <= 1:

                      return (
                          f"{years}+ years",
                          "GOOD FIT",
                          35
                      )


                  if years <= 2:

                      return (
                          f"{years}+ years",
                          "GOOD FIT",
                          25
                      )


                  if years <= 3:

                      return (
                          f"{years}+ years",
                          "PARTIAL FIT",
                          10
                      )


                  return (
                      f"{years}+ years",
                      "POOR FIT",
                      0
                  )


              # -------------------------------------------------
              # EXACT ONE YEAR
              # -------------------------------------------------

              if re.search(
                  r"\b1\s*(?:year|years|yr|yrs)\b",
                  all_text
              ):

                  return (
                      "1 year",
                      "EXCELLENT FIT",
                      40
                  )


              # -------------------------------------------------
              # EXACT TWO YEARS
              # -------------------------------------------------

              if re.search(
                  r"\b2\s*(?:year|years|yr|yrs)\b",
                  all_text
              ):

                  return (
                      "2 years",
                      "GOOD FIT",
                      28
                  )


              # -------------------------------------------------
              # NO EXPERIENCE REQUIRED
              # -------------------------------------------------

              if re.search(
                  r"no\s+experience|required\s+experience\s*[:\-]?\s*0|experience\s+not\s+required",
                  all_text
              ):

                  return (
                      "No experience required",
                      "EXCELLENT FIT",
                      45
                  )


              # -------------------------------------------------
              # UNKNOWN
              # -------------------------------------------------

              return (
                  "Not specified",
                  "UNKNOWN",
                  10
              )


          # =====================================================
          # ROLE MATCH
          # =====================================================

          def role_matches(title):

              title_text = normalize(
                  title
              )


              matches = []


              for role in roles:

                  if role in title_text:

                      matches.append(
                          role
                      )


              return matches


          # =====================================================
          # EDUCATION MATCH
          # =====================================================

          def education_matches(text):

              matches = []


              # Chemical Engineering
              if (
                  "chemical engineer" in text
                  or "chemical engineering" in text
              ):

                  if any(
                      x in education
                      for x in [
                          "chemical engineering",
                          "petrochemical engineering"
                      ]
                  ):

                      matches.append(
                          "chemical engineering"
                      )


              # Petrochemical
              if (
                  "petrochemical" in text
                  and "petrochemical engineering" in education
              ):

                  if "petrochemical engineering" not in matches:

                      matches.append(
                          "petrochemical engineering"
                      )


              # Process engineering
              if (
                  "process engineer" in text
                  or "process engineering" in text
              ):

                  if any(
                      x in education
                      for x in [
                          "chemical engineering",
                          "petrochemical engineering"
                      ]
                  ):

                      if "chemical engineering" not in matches:

                          matches.append(
                              "chemical engineering"
                          )


              # Production
              if (
                  "production engineer" in text
                  or "production engineering" in text
              ):

                  if any(
                      x in education
                      for x in [
                          "chemical engineering",
                          "petrochemical engineering"
                      ]
                  ):

                      if "chemical engineering" not in matches:

                          matches.append(
                              "chemical engineering"
                          )


              return matches


          # =====================================================
          # COUNTRY MATCH
          # =====================================================

          def target_country(location):

              text = normalize(
                  location
              )


              aliases = {

                  "united arab emirates": [
                      "uae",
                      "dubai",
                      "abu dhabi",
                      "sharjah"
                  ],

                  "saudi arabia": [
                      "saudi",
                      "ksa",
                      "riyadh",
                      "jeddah",
                      "jubail",
                      "dammam"
                  ],

                  "qatar": [
                      "qatar",
                      "doha"
                  ],

                  "oman": [
                      "oman",
                      "muscat",
                      "salalah"
                  ],

                  "kuwait": [
                      "kuwait",
                      "kuwait city"
                  ],

                  "bahrain": [
                      "bahrain",
                      "manama"
                  ]

              }


              for country in countries:

                  if country in text:

                      return True


                  for alias in aliases.get(
                      country,
                      []
                  ):

                      if alias in text:

                          return True


              return False


          # =====================================================
          # SCORE
          # =====================================================

          results = []


          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )


              company = str(
                  job.get(
                      "company",
                      ""
                  )
              )


              location = str(
                  job.get(
                      "location",
                      ""
                  )
              )


              description = str(
                  job.get(
                      "description"
                  )
                  or job.get(
                      "descriptionText"
                  )
                  or ""
              )


              url = str(
                  job.get(
                      "url"
                  )
                  or job.get(
                      "jobUrl"
                  )
                  or ""
              )


              text = normalize(
                  title
                  + " "
                  + description
                  + " "
                  + url
              )


              # -------------------------------------------------
              # EXPERIENCE
              # -------------------------------------------------

              experience, experience_fit, experience_score = (
                  detect_experience(job)
              )


              # -------------------------------------------------
              # ROLE
              # -------------------------------------------------

              matched_roles = role_matches(
                  title
              )


              role_score = (
                  25
                  if matched_roles
                  else 0
              )


              # -------------------------------------------------
              # EDUCATION
              # -------------------------------------------------

              matched_education = education_matches(
                  text
              )


              education_score = (
                  15
                  if matched_education
                  else 0
              )


              # -------------------------------------------------
              # SKILLS
              # -------------------------------------------------

              matched_skills = []


              for skill in skills:

                  if skill in text:

                      matched_skills.append(
                          skill
                      )


              skill_score = min(
                  15,
                  len(matched_skills) * 5
              )


              # -------------------------------------------------
              # COUNTRY
              # -------------------------------------------------

              country_ok = target_country(
                  location
              )


              country_score = (
                  5
                  if country_ok
                  else 0
              )


              # -------------------------------------------------
              # FINAL SCORE
              # -------------------------------------------------

              score = min(
                  100,
                  experience_score
                  + role_score
                  + education_score
                  + skill_score
                  + country_score
              )


              # =================================================
              # HARD EXPERIENCE RULES
              # =================================================

              # If job explicitly requires 3+ years,
              # it cannot be APPLY NOW.

              if experience_fit == "POOR FIT":

                  decision = "SKIP"

              elif experience_fit == "LOW FIT":

                  if score >= 60:

                      decision = "LOW PRIORITY"

                  else:

                      decision = "SKIP"

              elif (
                  experience_fit == "EXCELLENT FIT"
                  and matched_roles
                  and matched_education
                  and score >= 70
              ):

                  decision = "APPLY NOW"

              elif (
                  experience_fit in [
                      "EXCELLENT FIT",
                      "GOOD FIT"
                  ]
                  and matched_roles
                  and score >= 60
              ):

                  decision = "APPLY"

              elif score >= 50:

                  decision = "REVIEW"

              elif score >= 35:

                  decision = "LOW PRIORITY"

              else:

                  decision = "SKIP"


              # =================================================
              # CONCERNS
              # =================================================

              concerns = []


              if experience_fit in [
                  "LOW FIT",
                  "POOR FIT"
              ]:

                  concerns.append(
                      "Experience requirement is above target"
                  )


              if experience_fit == "UNKNOWN":

                  concerns.append(
                      "Experience requirement not confirmed"
                  )


              if not matched_roles:

                  concerns.append(
                      "Target role not confirmed"
                  )


              if not matched_education:

                  concerns.append(
                      "Education match not confirmed"
                  )


              if not matched_skills:

                  concerns.append(
                      "Relevant skills not found"
                  )


              # =================================================
              # PRACTICAL ACTION
              # =================================================

              if decision == "APPLY NOW":

                  action = (
                      "Apply immediately. "
                      "Strong entry-level match."
                  )

              elif decision == "APPLY":

                  action = (
                      "Apply. "
                      "Good fit for your current experience level."
                  )

              elif decision == "REVIEW":

                  action = (
                      "Review the full job description "
                      "before deciding."
                  )

              elif decision == "LOW PRIORITY":

                  action = (
                      "Keep as backup. "
                      "Prioritize stronger graduate jobs first."
                  )

              else:

                  action = (
                      "Skip. "
                      "Focus on better entry-level opportunities."
                  )


              results.append({

                  "score": score,

                  "decision": decision,

                  "title": title,

                  "company": company,

                  "location": location,

                  "experience": experience,

                  "experience_fit": experience_fit,

                  "matched_roles": matched_roles,

                  "matched_education": matched_education,

                  "matched_skills": matched_skills,

                  "concerns": concerns,

                  "action": action,

                  "url": url,

                  "job": job

              })


          # =====================================================
          # SORT
          # =====================================================

          priority = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1

          }


          results.sort(
              key=lambda x: (
                  priority.get(
                      x["decision"],
                      0
                  ),
                  x["score"]
              ),
              reverse=True
          )


          # =====================================================
          # SAVE
          # =====================================================

          with open(
              "ranked_jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  results,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # PRINT
          # =====================================================

          print("")
          print("==========================================")
          print("             RANKED JOBS")
          print("==========================================")


          for number, item in enumerate(
              results[:20],
              1
          ):

              print("")
              print(
                  "#"
                  + str(number),
                  item["score"],
                  "/100 -",
                  item["decision"]
              )

              print(
                  "JOB:",
                  item["title"]
              )

              print(
                  "COMPANY:",
                  item["company"]
              )

              print(
                  "LOCATION:",
                  item["location"]
              )

              print(
                  "EXPERIENCE:",
                  item["experience"]
              )

              print(
                  "EXPERIENCE FIT:",
                  item["experience_fit"]
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["matched_roles"]
                  )
                  if item["matched_roles"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["matched_education"]
                  )
                  if item["matched_education"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["matched_skills"]
                  )
                  if item["matched_skills"]
                  else "None"
              )

              print(
                  "ACTION:",
                  item["action"]
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )

              print(
                  "URL:",
                  item["url"]
              )

              print(
                  "------------------------------------------"
              )


          # =====================================================
          # FINAL SUMMARY
          # =====================================================

          counts = {
              "APPLY NOW": 0,
              "APPLY": 0,
              "REVIEW": 0,
              "LOW PRIORITY": 0,
              "SKIP": 0
          }


          for item in results:

              if item["decision"] in counts:

                  counts[
                      item["decision"]
                  ] += 1


          print("")
          print("==========================================")
          print("              FINAL SUMMARY")
          print("==========================================")

          print(
              "TOTAL JOBS:",
              len(results)
          )

          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )

          print(
              "APPLY:",
              counts["APPLY"]
          )

          print(
              "REVIEW:",
              counts["REVIEW"]
          )

          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )

          print(
              "SKIP:",
              counts["SKIP"]
          )

          print("")
          print(
              "MAIN PRIORITY:"
          )

          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )

          print("")
          print(
              "TARGET COUNTRIES:"
          )

          print(
              "Saudi Arabia | UAE | Qatar | "
              "Oman | Kuwait | Bahrain"
          )

          PY


