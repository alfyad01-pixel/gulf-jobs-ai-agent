name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          actor_url = (
              "https://api.apify.com/v2/actors/"
              "blackfalcondata~naukrigulf-scraper/"
              "run-sync-get-dataset-items"
          )

          searches = [
              ("Chemical Engineer", "Saudi Arabia"),
              ("Chemical Engineer", "United Arab Emirates"),
              ("Chemical Engineer", "Qatar"),
              ("Process Engineer", "Saudi Arabia"),
              ("Process Engineer", "United Arab Emirates"),
              ("Process Engineer", "Qatar"),
              ("Production Engineer", "Saudi Arabia"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Engineer", "Qatar")
          ]

          all_jobs = []

          for query, location in searches:
              print(f"Searching: {query} - {location}")

              payload = {
                  "mode": "search",
                  "query": query,
                  "location": location,
                  "maxResults": 2,
                  "includeDetails": False,
                  "compact": True,
                  "excludeEmptyFields": True
              }

              request = urllib.request.Request(
                  actor_url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization": (
                          "Bearer " + os.environ["APIFY_API_TOKEN"]
                      )
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=900
                  ) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  if isinstance(result, list):
                      all_jobs.extend(result)

              except urllib.error.HTTPError as e:
                  print(f"Search failed: {query} - {location}")
                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              except Exception as e:
                  print(
                      f"Unexpected error: "
                      f"{query} - {location}"
                  )
                  print(str(e))

          # Remove duplicates
          unique = {}

          for job in all_jobs:
              key = (
                  job.get("url")
                  or job.get("jobUrl")
                  or (
                      str(job.get("title", "")) + "|" +
                      str(job.get("company", "")) + "|" +
                      str(job.get("location", ""))
                  )
              )

              unique[key] = job

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  list(unique.values()),
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Total unique jobs: {len(unique)}"
          )
          PY

      - name: Analyze jobs
        run: |
          echo "================================"
          echo "      GULF JOBS AI AGENT"
          echo "================================"

          python - <<'PY'
          import json
          import re

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:
              jobs = json.load(f)

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:
              profile = json.load(f)

          roles = [
              x.lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]

          countries = [
              x.lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]

          education = [
              x.lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]

          skills = [
              x.lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]

          experience_years = profile.get(
              "experience_years",
              0
          )

          def get_job_text(job):
              parts = []

              fields = [
                  "title",
                  "description",
                  "descriptionText",
                  "experience",
                  "requirements",
                  "skills",
                  "location",
                  "country"
              ]

              for field in fields:
                  value = job.get(
                      field,
                      ""
                  )

                  if isinstance(value, list):
                      parts.extend(
                          str(x)
                          for x in value
                      )
                  else:
                      parts.append(
                          str(value)
                      )

              return " ".join(parts).lower()

          def calculate_experience_score(text):

              # Ideal for the user's 1 year experience
              ideal_patterns = [
                  "0-1 year",
                  "0-2 years",
                  "0 to 2 years",
                  "0 - 2 years",
                  "1 year",
                  "1+ year",
                  "1-2 years",
                  "1 to 2 years",
                  "fresher",
                  "fresh graduate",
                  "entry level",
                  "entry-level"
              ]

              for pattern in ideal_patterns:
                  if pattern in text:
                      return 20

              # Detect ranges such as 2-4 years
              ranges = re.findall(
                  r'(\d+)\s*(?:-|to)\s*(\d+)\s*years?',
                  text
              )

              for low, high in ranges:
                  low = int(low)
                  high = int(high)

                  if low <= experience_years <= high:
                      return 20

                  if low <= experience_years + 1 <= high:
                      return 15

                  if high < experience_years:
                      return 10

                  if low > experience_years + 2:
                      return 0

              # Senior positions
              senior_words = [
                  "senior",
                  "lead engineer",
                  "principal",
                  "manager",
                  "supervisor",
                  "head of"
              ]

              if any(
                  word in text
                  for word in senior_words
              ):
                  return 0

              return 10

          scored = []

          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )

              location = str(
                  job.get("location")
                  or job.get("country")
                  or ""
              )

              text = get_job_text(job)

              # -------------------------
              # 1. ROLE MATCH - 30 points
              # -------------------------

              role_matches = []

              for role in roles:
                  if role in title.lower():
                      role_matches.append(role)

              role_score = 30 if role_matches else 0

              # Partial engineering match
              if not role_matches:
                  engineering_roles = [
                      "engineer",
                      "engineering",
                      "operator",
                      "production"
                  ]

                  if any(
                      word in title.lower()
                      for word in engineering_roles
                  ):
                      role_score = 15

              # -------------------------
              # 2. EDUCATION - 25 points
              # -------------------------

              education_matches = []

              for item in education:
                  if item in text:
                      education_matches.append(
                          item
                      )

              education_score = 25 if (
                  education_matches
              ) else 0

              # -------------------------
              # 3. EXPERIENCE - 20 points
              # -------------------------

              exp_score = calculate_experience_score(
                  text
              )

              # -------------------------
              # 4. SKILLS - 15 points
              # -------------------------

              skill_matches = []

              for skill in skills:
                  if skill in text:
                      skill_matches.append(
                          skill
                      )

              skill_score = min(
                  15,
                  len(skill_matches) * 3
              )

              # -------------------------
              # 5. GULF COUNTRY - 10 points
              # -------------------------

              country_matches = []

              for country in countries:
                  if country in text:
                      country_matches.append(
                          country
                      )

              country_score = 10 if (
                  country_matches
              ) else 0

              # -------------------------
              # FINAL SCORE
              # -------------------------

              total = min(
                  100,
                  role_score
                  + education_score
                  + exp_score
                  + skill_score
                  + country_score
              )

              if total >= 85:
                  level = "EXCELLENT"
                  icon = "🔥"

              elif total >= 75:
                  level = "VERY GOOD"
                  icon = "🟢"

              elif total >= 60:
                  level = "GOOD"
                  icon = "🟡"

              elif total >= 40:
                  level = "WEAK"
                  icon = "🟠"

              else:
                  level = "NOT SUITABLE"
                  icon = "🔴"

              scored.append({
                  "score": total,
                  "level": level,
                  "icon": icon,
                  "job": job,
                  "role_matches": role_matches,
                  "education_matches": education_matches,
                  "skill_matches": skill_matches,
                  "country_matches": country_matches
              })

          # Sort from highest score
          # to lowest score

          scored.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          print("")
          print("================================")
          print("          TOP MATCHES")
          print("================================")

          for i, item in enumerate(
              scored[:10],
              1
          ):

              job = item["job"]

              print("")
              print(
                  f"{i}. "
                  f"{item['icon']} "
                  f"{item['score']}/100 "
                  f"- {item['level']}"
              )

              print(
                  "JOB:",
                  job.get(
                      "title",
                      "Unknown"
                  )
              )

              print(
                  "COMPANY:",
                  job.get(
                      "company",
                      "Unknown"
                  )
              )

              print(
                  "LOCATION:",
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or "Unknown"
              )

              print(
                  "EXPERIENCE:",
                  job.get(
                      "experience",
                      "Not specified"
                  )
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["role_matches"]
                  )
                  if item["role_matches"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["education_matches"]
                  )
                  if item["education_matches"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["skill_matches"]
                  )
                  if item["skill_matches"]
                  else "None"
              )

              print(
                  "COUNTRY MATCH:",
                  ", ".join(
                      item["country_matches"]
                  )
                  if item["country_matches"]
                  else "None"
              )

              print(
                  "URL:",
                  job.get("url")
                  or job.get("jobUrl")
                  or "No URL"
              )

              print("--------------------------------")

          print("")
          print(
              "TOTAL JOBS ANALYZED:",
              len(jobs)
          )

          print(
              "================================"
          )
          PY
