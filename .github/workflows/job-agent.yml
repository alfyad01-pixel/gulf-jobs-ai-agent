name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================
      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH GULF JOBS FROM APIFY
      # ==========================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error


          API_TOKEN = os.environ["APIFY_API_TOKEN"]

          ACTOR_ID = "blackfalcondata~naukrigulf-scraper"

          BASE_URL = "https://api.apify.com/v2"


          # =====================================================
          # TARGET SEARCHES
          # =====================================================

          searches = [

              (
                  "Saudi Arabia",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Saudi Arabia",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Saudi Arabia",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "United Arab Emirates",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Qatar",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Oman",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Kuwait",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Chemical Engineer,Graduate Chemical Engineer,Chemical Engineer Fresher,Chemical Engineer Entry Level,Chemical Engineer 0-1 years,Chemical Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Process Engineer,Graduate Process Engineer,Process Engineer Fresher,Process Engineer Entry Level,Process Engineer 0-1 years,Process Engineer 0-2 years"
              ),

              (
                  "Bahrain",
                  "Junior Production Engineer,Graduate Production Engineer,Production Engineer Fresher,Production Engineer Entry Level,Production Engineer 0-1 years,Production Engineer 0-2 years"
              )
          ]


          def api_request(url, method="GET", payload=None):

              headers = {
                  "Authorization": "Bearer " + API_TOKEN
              }

              data = None

              if payload is not None:

                  data = json.dumps(payload).encode("utf-8")

                  headers["Content-Type"] = "application/json"


              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )


              with urllib.request.urlopen(
                  request,
                  timeout=120
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # =====================================================
          # START ACTOR RUNS
          # =====================================================

          runs = []


          print("")
          print("==========================================")
          print("STARTING APIFY SEARCHES")
          print("==========================================")


          for location, query in searches:

              print("")
              print("Starting:")
              print("Location:", location)
              print("Query:", query[:100])


              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  "maxResults": 30,

                  "includeDetails": True,

                  "compact": False,

                  "excludeEmptyFields": True

              }


              url = (
                  BASE_URL
                  + "/acts/"
                  + ACTOR_ID
                  + "/runs"
              )


              try:

                  result = api_request(
                      url,
                      method="POST",
                      payload=payload
                  )


                  run_data = result.get("data", {})

                  run_id = run_data.get("id")

                  dataset_id = run_data.get(
                      "defaultDatasetId"
                  )


                  if run_id:

                      runs.append(
                          {
                              "run_id": run_id,
                              "dataset_id": dataset_id,
                              "location": location,
                              "query": query
                          }
                      )

                      print(
                          "RUN STARTED:",
                          run_id
                      )

              except Exception as e:

                  print(
                      "FAILED TO START:",
                      location,
                      str(e)
                  )


          print("")
          print(
              "TOTAL RUNS STARTED:",
              len(runs)
          )


          # =====================================================
          # WAIT FOR ALL RUNS
          # =====================================================

          pending = {
              x["run_id"]: x
              for x in runs
          }


          finished = []


          max_wait = 900

          started_wait = time.time()


          while pending:

              if time.time() - started_wait > max_wait:

                  print("")
                  print(
                      "MAXIMUM WAIT TIME REACHED."
                  )

                  break


              for run_id in list(pending.keys()):

                  run_info = pending[run_id]


                  try:

                      status_url = (
                          BASE_URL
                          + "/actor-runs/"
                          + run_id
                      )


                      result = api_request(
                          status_url
                      )


                      data = result.get(
                          "data",
                          {}
                      )


                      status = data.get(
                          "status"
                      )


                      print(
                          "RUN",
                          run_id,
                          "STATUS:",
                          status
                      )


                      if status == "SUCCEEDED":

                          run_info["dataset_id"] = (
                              data.get(
                                  "defaultDatasetId"
                              )
                              or run_info["dataset_id"]
                          )

                          finished.append(
                              run_info
                          )

                          del pending[run_id]


                      elif status in [
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT",
                          "TIMING-OUT"
                      ]:

                          print(
                              "RUN FAILED:",
                              run_id
                          )

                          del pending[run_id]


                  except Exception as e:

                      print(
                          "STATUS CHECK ERROR:",
                          run_id,
                          str(e)
                      )


              if pending:

                  time.sleep(15)


          # =====================================================
          # DOWNLOAD DATASETS
          # =====================================================

          all_jobs = []


          print("")
          print("==========================================")
          print("DOWNLOADING DATASETS")
          print("==========================================")


          for run_info in finished:

              dataset_id = run_info.get(
                  "dataset_id"
              )


              if not dataset_id:

                  continue


              dataset_url = (
                  BASE_URL
                  + "/datasets/"
                  + dataset_id
                  + "/items"
                  + "?format=json"
              )


              try:

                  result = api_request(
                      dataset_url
                  )


                  if isinstance(result, list):

                      print(
                          run_info["location"],
                          "=>",
                          len(result),
                          "jobs"
                      )

                      all_jobs.extend(result)


              except Exception as e:

                  print(
                      "DATASET ERROR:",
                      dataset_id,
                      str(e)
                  )


          # =====================================================
          # REMOVE DUPLICATES
          # =====================================================

          unique = {}


          for job in all_jobs:

              if not isinstance(job, dict):

                  continue


              url = (
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              )


              title = str(
                  job.get("title", "")
              ).strip().lower()


              company = str(
                  job.get("company", "")
              ).strip().lower()


              location = str(
                  job.get("location", "")
              ).strip().lower()


              key = (
                  url.strip().lower()
                  if url
                  else
                  title
                  + "|"
                  + company
                  + "|"
                  + location
              )


              if key:

                  unique[key] = job


          jobs = list(
              unique.values()
          )


          # =====================================================
          # SAVE JOBS
          # =====================================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("==========================================")
          print(
              "TOTAL UNIQUE JOBS:",
              len(jobs)
          )
          print("==========================================")


          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

          import json
          import re


          # =====================================================
          # LOAD DATA
          # =====================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [
              x.lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          skills = [
              x.lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          education = [
              x.lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


          countries = [
              x.lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]


          # =====================================================
          # EXPERIENCE DETECTION
          # =====================================================

          def detect_experience(job):

              fields = [

                  job.get("experience"),

                  job.get("experienceRequired"),

                  job.get("experienceLevel"),

                  job.get("experienceText"),

                  job.get("jobExperience"),

                  job.get("description"),

                  job.get("descriptionText"),

                  job.get("url"),

                  job.get("jobUrl")

              ]


              text = " ".join(
                  str(x)
                  for x in fields
                  if x
              ).lower()


              # Fresh graduate / fresher

              if any(
                  x in text
                  for x in [
                      "fresh graduate",
                      "fresh graduates",
                      "fresher",
                      "freshers",
                      "entry level",
                      "entry-level",
                      "graduate trainee",
                      "graduate engineer",
                      "new graduate"
                  ]
              ):

                  return (
                      "0 years",
                      "EXCELLENT FIT",
                      35
                  )


              # Explicit 0-1

              if re.search(
                  r"\b0\s*[-–]\s*1\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "0-1 years",
                      "EXCELLENT FIT",
                      35
                  )


              # Explicit 0-2

              if re.search(
                  r"\b0\s*[-–]\s*2\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "0-2 years",
                      "EXCELLENT FIT",
                      35
                  )


              # 1 year

              if re.search(
                  r"\b1\s*(?:year|years|yr|yrs)\b",
                  text
              ):

                  return (
                      "1 year",
                      "EXCELLENT FIT",
                      32
                  )


              # 1-3

              if re.search(
                  r"\b1\s*[-–]\s*3\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "1-3 years",
                      "GOOD FIT",
                      24
                  )


              # 2-3

              if re.search(
                  r"\b2\s*[-–]\s*3\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "2-3 years",
                      "PARTIAL FIT",
                      12
                  )


              # 2-4

              if re.search(
                  r"\b2\s*[-–]\s*4\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "2-4 years",
                      "POOR FIT",
                      5
                  )


              # 3+

              if re.search(
                  r"\b3\s*\+\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "3+ years",
                      "POOR FIT",
                      0
                  )


              # 4+

              if re.search(
                  r"\b4\s*\+\s*(?:years?|yrs?)\b",
                  text
              ):

                  return (
                      "4+ years",
                      "POOR FIT",
                      0
                  )


              return (
                  "Not specified",
                  "UNKNOWN",
                  15
              )


          # =====================================================
          # COUNTRY DETECTION
          # =====================================================

          def country_match(location):

              text = str(
                  location
              ).lower()


              for country in countries:

                  if country in text:

                      return True


              aliases = {

                  "united arab emirates": [
                      "uae",
                      "dubai",
                      "abu dhabi",
                      "sharjah"
                  ],

                  "saudi arabia": [
                      "ksa",
                      "saudi",
                      "riyadh",
                      "jeddah",
                      "jubail",
                      "dammam"
                  ],

                  "qatar": [
                      "doha"
                  ],

                  "oman": [
                      "muscat",
                      "salalah"
                  ],

                  "kuwait": [
                      "kuwait city"
                  ],

                  "bahrain": [
                      "manama"
                  ]

              }


              for country, names in aliases.items():

                  if country in countries:

                      if any(
                          x in text
                          for x in names
                      ):

                          return True


              return False


          # =====================================================
          # SCORE JOB
          # =====================================================

          scored = []


          for job in jobs:

              title = str(
                  job.get("title", "")
              )


              company = str(
                  job.get("company", "")
              )


              location = str(
                  job.get("location", "")
              )


              description = str(
                  job.get("description")
                  or job.get("descriptionText")
                  or ""
              )


              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              )


              text = (
                  title
                  + " "
                  + description
                  + " "
                  + url
              ).lower()


              # -------------------------------------------------
              # ROLE MATCH
              # -------------------------------------------------

              matched_roles = [

                  role

                  for role in roles

                  if role in title.lower()

              ]


              role_score = (
                  25
                  if matched_roles
                  else 0
              )


              # -------------------------------------------------
              # EDUCATION MATCH
              # -------------------------------------------------

              matched_education = []


              for item in education:

                  words = item.split()


                  if any(
                      word in text
                      for word in words
                      if len(word) > 3
                  ):

                      matched_education.append(
                          item
                      )


              education_score = (

                  15
                  if matched_education
                  else 0

              )


              # -------------------------------------------------
              # SKILLS
              # -------------------------------------------------

              matched_skills = [

                  skill

                  for skill in skills

                  if skill in text

              ]


              skill_score = min(
                  15,
                  len(matched_skills) * 5
              )


              # -------------------------------------------------
              # EXPERIENCE
              # -------------------------------------------------

              experience_text, experience_fit, experience_score = (
                  detect_experience(job)
              )


              # -------------------------------------------------
              # COUNTRY
              # -------------------------------------------------

              in_target_country = country_match(
                  location
              )


              country_score = (
                  5
                  if in_target_country
                  else 0
              )


              # -------------------------------------------------
              # TOTAL
              # -------------------------------------------------

              score = min(
                  100,
                  role_score
                  + education_score
                  + skill_score
                  + experience_score
                  + country_score
              )


              # -------------------------------------------------
              # DECISION
              # -------------------------------------------------

              concerns = []


              if experience_fit == "POOR FIT":

                  concerns.append(
                      "Experience requirement is above target"
                  )


              if not matched_roles:

                  concerns.append(
                      "Target role not confirmed"
                  )


              if not matched_education:

                  concerns.append(
                      "Education match not confirmed"
                  )


              if not matched_skills:

                  concerns.append(
                      "Relevant skills not found"
                  )


              if not in_target_country:

                  concerns.append(
                      "Country not in target list"
                  )


              # Strong fresh graduate job

              if (
                  experience_fit == "EXCELLENT FIT"
                  and matched_roles
                  and score >= 75
              ):

                  decision = "APPLY NOW"


              elif (
                  experience_fit in [
                      "EXCELLENT FIT",
                      "GOOD FIT"
                  ]
                  and matched_roles
                  and score >= 65
              ):

                  decision = "APPLY"


              elif score >= 50:

                  decision = "REVIEW"


              elif score >= 35:

                  decision = "LOW PRIORITY"


              else:

                  decision = "SKIP"


              # -------------------------------------------------
              # PRACTICAL RECOMMENDATION
              # -------------------------------------------------

              if decision == "APPLY NOW":

                  action = (
                      "Apply immediately. "
                      "This job is strongly aligned with "
                      "your graduate-level target."
                  )

              elif decision == "APPLY":

                  action = (
                      "Apply. "
                      "The experience requirement and role "
                      "are reasonably aligned."
                  )

              elif decision == "REVIEW":

                  action = (
                      "Review the full description before applying. "
                      "There is potential but one or more conditions "
                      "need verification."
                  )

              elif decision == "LOW PRIORITY":

                  action = (
                      "Keep as backup. "
                      "Apply only after stronger graduate opportunities."
                  )

              else:

                  action = (
                      "Skip for now. "
                      "Focus effort on stronger entry-level matches."
                  )


              scored.append({

                  "score": score,

                  "decision": decision,

                  "job": job,

                  "title": title,

                  "company": company,

                  "location": location,

                  "experience": experience_text,

                  "experience_fit": experience_fit,

                  "matched_roles": matched_roles,

                  "matched_education": matched_education,

                  "matched_skills": matched_skills,

                  "concerns": concerns,

                  "action": action,

                  "url": url

              })


          # =====================================================
          # SORT
          # =====================================================

          priority = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1

          }


          scored.sort(
              key=lambda x: (
                  priority.get(
                      x["decision"],
                      0
                  ),
                  x["score"]
              ),
              reverse=True
          )


          # =====================================================
          # SAVE RANKED RESULTS
          # =====================================================

          with open(
              "ranked_jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  scored,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =====================================================
          # PRINT RANKED JOBS
          # =====================================================

          print("")
          print("==========================================")
          print("          RANKED JOBS")
          print("==========================================")


          for index, item in enumerate(
              scored[:20],
              start=1
          ):

              print("")
              print(
                  "#" + str(index),
                  str(item["score"]) + "/100",
                  "-",
                  item["decision"]
              )

              print("")
              print(
                  "JOB:",
                  item["title"]
              )

              print(
                  "COMPANY:",
                  item["company"]
              )

              print(
                  "LOCATION:",
                  item["location"]
              )

              print(
                  "EXPERIENCE:",
                  item["experience"]
              )

              print(
                  "EXPERIENCE FIT:",
                  item["experience_fit"]
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["matched_roles"]
                  )
                  if item["matched_roles"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["matched_education"]
                  )
                  if item["matched_education"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["matched_skills"]
                  )
                  if item["matched_skills"]
                  else "None"
              )

              print(
                  "ACTION:",
                  item["action"]
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )

              print(
                  "URL:",
                  item["url"]
              )

              print(
                  "------------------------------------------"
              )


          # =====================================================
          # FINAL SUMMARY
          # =====================================================

          counts = {

              "APPLY NOW": 0,

              "APPLY": 0,

              "REVIEW": 0,

              "LOW PRIORITY": 0,

              "SKIP": 0

          }


          for item in scored:

              decision = item["decision"]

              if decision in counts:

                  counts[decision] += 1


          print("")
          print("==========================================")
          print("             FINAL SUMMARY")
          print("==========================================")

          print(
              "TOTAL JOBS:",
              len(scored)
          )

          print(
              "APPLY NOW:",
              counts["APPLY NOW"]
          )

          print(
              "APPLY:",
              counts["APPLY"]
          )

          print(
              "REVIEW:",
              counts["REVIEW"]
          )

          print(
              "LOW PRIORITY:",
              counts["LOW PRIORITY"]
          )

          print(
              "SKIP:",
              counts["SKIP"]
          )

          print("")
          print(
              "MAIN PRIORITY:"
          )

          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )

          print("")
          print(
              "TARGET COUNTRIES:"
          )

          print(
              "Saudi Arabia | UAE | Qatar | "
              "Oman | Kuwait | Bahrain"
          )

          PY


      # ==========================================
      # 4. SHOW OUTPUT FILES
      # ==========================================
      - name: Show generated files
        run: |

          echo "================================"
          echo "GENERATED FILES"
          echo "================================"

          ls -lh jobs.json ranked_jobs.json

          echo ""
          echo "JOB COUNT:"

          python - <<'PY'

          import json

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          print(
              len(jobs)
          )

          PY
