name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================

      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH GULF JOBS FROM APIFY
      # ==========================================

      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error


          actor_url = (
              "https://api.apify.com/v2/actors/"
              "blackfalcondata~naukrigulf-scraper/"
              "run-sync-get-dataset-items"
          )


          # ======================================
          # TARGET SEARCHES
          # ======================================

          searches = [

              # Saudi Arabia
              ("Chemical Engineer", "Saudi Arabia"),
              ("Junior Chemical Engineer", "Saudi Arabia"),
              ("Process Engineer", "Saudi Arabia"),
              ("Junior Process Engineer", "Saudi Arabia"),
              ("Production Engineer", "Saudi Arabia"),
              ("Production Operator", "Saudi Arabia"),
              ("Process Operator", "Saudi Arabia"),
              ("Petrochemical Engineer", "Saudi Arabia"),
              ("Graduate Engineer", "Saudi Arabia"),

              # UAE
              ("Chemical Engineer", "United Arab Emirates"),
              ("Junior Chemical Engineer", "United Arab Emirates"),
              ("Process Engineer", "United Arab Emirates"),
              ("Junior Process Engineer", "United Arab Emirates"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Operator", "United Arab Emirates"),
              ("Process Operator", "United Arab Emirates"),
              ("Petrochemical Engineer", "United Arab Emirates"),
              ("Graduate Engineer", "United Arab Emirates"),

              # Qatar
              ("Chemical Engineer", "Qatar"),
              ("Junior Chemical Engineer", "Qatar"),
              ("Process Engineer", "Qatar"),
              ("Junior Process Engineer", "Qatar"),
              ("Production Engineer", "Qatar"),
              ("Production Operator", "Qatar"),
              ("Process Operator", "Qatar"),
              ("Petrochemical Engineer", "Qatar"),
              ("Graduate Engineer", "Qatar"),

              # Oman
              ("Chemical Engineer", "Oman"),
              ("Junior Chemical Engineer", "Oman"),
              ("Process Engineer", "Oman"),
              ("Junior Process Engineer", "Oman"),
              ("Production Engineer", "Oman"),
              ("Production Operator", "Oman"),
              ("Process Operator", "Oman"),
              ("Petrochemical Engineer", "Oman"),
              ("Graduate Engineer", "Oman"),

              # Kuwait
              ("Chemical Engineer", "Kuwait"),
              ("Junior Chemical Engineer", "Kuwait"),
              ("Process Engineer", "Kuwait"),
              ("Junior Process Engineer", "Kuwait"),
              ("Production Engineer", "Kuwait"),
              ("Production Operator", "Kuwait"),
              ("Process Operator", "Kuwait"),
              ("Petrochemical Engineer", "Kuwait"),
              ("Graduate Engineer", "Kuwait"),

              # Bahrain
              ("Chemical Engineer", "Bahrain"),
              ("Junior Chemical Engineer", "Bahrain"),
              ("Process Engineer", "Bahrain"),
              ("Junior Process Engineer", "Bahrain"),
              ("Production Engineer", "Bahrain"),
              ("Production Operator", "Bahrain"),
              ("Process Operator", "Bahrain"),
              ("Petrochemical Engineer", "Bahrain"),
              ("Graduate Engineer", "Bahrain")
          ]


          all_jobs = []


          # ======================================
          # FETCH
          # ======================================

          for index, (query, location) in enumerate(searches, 1):

              print("")
              print(
                  f"[{index}/{len(searches)}] "
                  f"Searching: {query} - {location}"
              )

              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  # Keep this low to reduce timeout risk
                  "maxResults": 1,

                  "includeDetails": False,

                  "compact": True,

                  "excludeEmptyFields": True
              }


              request = urllib.request.Request(

                  actor_url,

                  data=json.dumps(
                      payload
                  ).encode("utf-8"),

                  method="POST",

                  headers={

                      "Content-Type":
                          "application/json",

                      "Authorization":
                          "Bearer "
                          + os.environ[
                              "APIFY_API_TOKEN"
                          ]
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=300
                  ) as response:

                      result = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )


                  if isinstance(result, list):

                      all_jobs.extend(
                          result
                      )

                      print(
                          "Jobs received:",
                          len(result)
                      )

                  else:

                      print(
                          "No jobs returned"
                      )


              except urllib.error.HTTPError as e:

                  print(
                      "Search failed:",
                      query,
                      "-",
                      location
                  )

                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )


              except Exception as e:

                  print(
                      "Unexpected error:",
                      str(e)
                  )


          # ======================================
          # REMOVE DUPLICATES
          # ======================================

          unique = {}


          for job in all_jobs:

              key = (

                  job.get("url")

                  or job.get("jobUrl")

                  or (

                      str(
                          job.get(
                              "title",
                              ""
                          )
                      )

                      + "|"

                      + str(
                          job.get(
                              "company",
                              ""
                          )
                      )

                      + "|"

                      + str(
                          job.get(
                              "location",
                              ""
                          )
                      )
                  )
              )


              unique[key] = job


          # ======================================
          # SAVE JOBS
          # ======================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(

                  list(
                      unique.values()
                  ),

                  f,

                  ensure_ascii=False,

                  indent=2
              )


          print("")
          print(
              "================================"
          )

          print(
              "TOTAL UNIQUE JOBS:",
              len(unique)
          )

          print(
              "================================"
          )

          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================

      - name: Analyze jobs
        run: |

          echo "========================================"
          echo "       GULF JOBS AI AGENT"
          echo "       FRESH GRADUATE MODE"
          echo "========================================"


          python - <<'PY'

          import json
          import re


          # ======================================
          # LOAD PROFILE
          # ======================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [

              x.lower()

              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          countries = [

              x.lower()

              for x in profile.get(
                  "target_countries",
                  []
              )
          ]


          education = [

              x.lower()

              for x in profile.get(
                  "education",
                  []
              )
          ]


          skills = [

              x.lower()

              for x in profile.get(
                  "skills",
                  []
              )
          ]


          experience_years = profile.get(
              "experience_years",
              1
          )


          # ======================================
          # JOB TEXT
          # ======================================

          def get_text(job):

              fields = [

                  "title",
                  "description",
                  "descriptionText",
                  "experience",
                  "requirements",
                  "skills",
                  "location",
                  "country"
              ]


              parts = []


              for field in fields:

                  value = job.get(
                      field,
                      ""
                  )


                  if isinstance(
                      value,
                      list
                  ):

                      parts.extend(
                          str(x)
                          for x in value
                      )

                  else:

                      parts.append(
                          str(value)
                      )


              return " ".join(
                  parts
              ).lower()


          # ======================================
          # EXPERIENCE ANALYSIS
          # ======================================

          def analyze_experience(text):

              fresh_keywords = [

                  "fresh graduate",
                  "fresh graduates",
                  "fresher",
                  "freshers",
                  "entry level",
                  "entry-level",
                  "graduate trainee",
                  "graduate engineer",
                  "graduate program",
                  "graduate programme",
                  "trainee engineer",
                  "new graduate",
                  "recent graduate",
                  "no experience",
                  "without experience",
                  "zero experience",
                  "0 years",
                  "0 year",
                  "0-1 year",
                  "0-1 years",
                  "0 - 1 year",
                  "0 - 1 years",
                  "0 to 1 year",
                  "0 to 1 years",
                  "0-2 years",
                  "0 - 2 years",
                  "0 to 2 years"
              ]


              for keyword in fresh_keywords:

                  if keyword in text:

                      return {

                          "points": 35,

                          "level":
                              "FRESH GRADUATE",

                          "reason":
                              "Excellent experience fit"
                      }


              one_year_keywords = [

                  "1 year",
                  "1+ year",
                  "1+ years",
                  "1-2 years",
                  "1 - 2 years",
                  "1 to 2 years"
              ]


              for keyword in one_year_keywords:

                  if keyword in text:

                      return {

                          "points": 33,

                          "level":
                              "EXCELLENT FIT",

                          "reason":
                              "Matches your 1 year experience"
                      }


              two_three = [

                  "2-3 years",
                  "2 - 3 years",
                  "2 to 3 years"
              ]


              for keyword in two_three:

                  if keyword in text:

                      return {

                          "points": 23,

                          "level":
                              "POSSIBLE",

                          "reason":
                              "Slightly above your experience"
                      }


              two_four = [

                  "2-4 years",
                  "2 - 4 years",
                  "2 to 4 years"
              ]


              for keyword in two_four:

                  if keyword in text:

                      return {

                          "points": 16,

                          "level":
                              "LOWER FIT",

                          "reason":
                              "Requires more experience"
                      }


              # Detect 3+ years

              patterns = [

                  r"3\+\s*years",
                  r"4\+\s*years",
                  r"5\+\s*years",
                  r"6\+\s*years",
                  r"7\+\s*years",
                  r"8\+\s*years",
                  r"10\+\s*years"
              ]


              for pattern in patterns:

                  if re.search(
                      pattern,
                      text
                  ):

                      return {

                          "points": 3,

                          "level":
                              "NOT SUITABLE",

                          "reason":
                              "Requires significant experience"
                      }


              senior_words = [

                  "senior",
                  "lead engineer",
                  "principal engineer",
                  "engineering manager",
                  "project manager",
                  "department manager",
                  "supervisor",
                  "head of"
              ]


              for word in senior_words:

                  if word in text:

                      return {

                          "points": 0,

                          "level":
                              "NOT SUITABLE",

                          "reason":
                              "Senior or management position"
                      }


              return {

                  "points": 20,

                  "level":
                      "UNKNOWN",

                  "reason":
                      "Experience requirement unclear"
              }


          # ======================================
          # ROLE ANALYSIS
          # ======================================

          def analyze_role(title):

              title = title.lower()


              exact_matches = []


              for role in roles:

                  if role in title:

                      exact_matches.append(
                          role
                      )


              if exact_matches:

                  return 25, exact_matches


              useful_keywords = [

                  "chemical",
                  "process",
                  "production",
                  "petrochemical",
                  "operator",
                  "operations"
              ]


              if any(
                  keyword in title
                  for keyword
                  in useful_keywords
              ):

                  return 15, []


              return 0, []


          # ======================================
          # ANALYZE
          # ======================================

          results = []


          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )


              text = get_text(
                  job
              )


              # ------------------------------
              # EXPERIENCE
              # ------------------------------

              exp = analyze_experience(
                  text
              )


              # ------------------------------
              # ROLE
              # ------------------------------

              role_points, role_matches = (
                  analyze_role(
                      title
                  )
              )


              # ------------------------------
              # EDUCATION
              # ------------------------------

              education_matches = []


              for item in education:

                  if item in text:

                      education_matches.append(
                          item
                      )


              education_points = (

                  20

                  if education_matches

                  else 0
              )


              # ------------------------------
              # SKILLS
              # ------------------------------

              skill_matches = []


              for skill in skills:

                  if skill in text:

                      skill_matches.append(
                          skill
                      )


              skill_points = min(

                  15,

                  len(
                      skill_matches
                  ) * 3
              )


              # ------------------------------
              # COUNTRY
              # ------------------------------

              country_matches = []


              for country in countries:

                  if country in text:

                      country_matches.append(
                          country
                      )


              country_points = (

                  5

                  if country_matches

                  else 0
              )


              # ------------------------------
              # FRESH GRADUATE BONUS
              # ------------------------------

              fresh_bonus = 0


              fresh_words = [

                  "fresh graduate",
                  "fresher",
                  "entry level",
                  "graduate trainee",
                  "graduate engineer",
                  "no experience",
                  "0-1 years",
                  "0-2 years"
              ]


              if any(
                  word in text
                  for word in fresh_words
              ):

                  fresh_bonus = 5


              # ------------------------------
              # FINAL SCORE
              # ------------------------------

              score = min(

                  100,

                  role_points
                  + education_points
                  + exp["points"]
                  + skill_points
                  + country_points
                  + fresh_bonus
              )


              # ------------------------------
              # DECISION
              # ------------------------------

              if (
                  exp["level"]
                  == "NOT SUITABLE"
              ):

                  decision = "SKIP"

                  icon = "🔴"


              elif score >= 85:

                  decision = "APPLY NOW"

                  icon = "🔥"


              elif score >= 75:

                  decision = "APPLY"

                  icon = "🟢"


              elif score >= 60:

                  decision = "REVIEW"

                  icon = "🟡"


              elif score >= 45:

                  decision = "LOW PRIORITY"

                  icon = "🟠"


              else:

                  decision = "SKIP"

                  icon = "🔴"


              # ------------------------------
              # WHY
              # ------------------------------

              reasons = []


              if exp["points"] >= 30:

                  reasons.append(
                      "Fresh graduate / 0-2 years"
                  )


              elif exp["points"] >= 20:

                  reasons.append(
                      "Experience requirement is close"
                  )


              if role_points >= 25:

                  reasons.append(
                      "Target role matches"
                  )


              if education_points:

                  reasons.append(
                      "Education matches"
                  )


              if skill_matches:

                  reasons.append(

                      str(
                          len(
                              skill_matches
                          )
                      )
                      + " matching skills"
                  )


              # ------------------------------
              # CONCERNS
              # ------------------------------

              concerns = []


              if exp["points"] <= 16:

                  concerns.append(
                      "Experience requirement is high"
                  )


              if not education_matches:

                  concerns.append(
                      "Education match unclear"
                  )


              if not skill_matches:

                  concerns.append(
                      "Few matching skills"
                  )


              senior_terms = [

                  "senior",
                  "lead",
                  "manager",
                  "supervisor"
              ]


              if any(
                  word in title.lower()
                  for word in senior_terms
              ):

                  concerns.append(
                      "Senior/lead position"
                  )


              results.append({

                  "score":
                      score,

                  "decision":
                      decision,

                  "icon":
                      icon,

                  "job":
                      job,

                  "experience":
                      exp,

                  "role_matches":
                      role_matches,

                  "education_matches":
                      education_matches,

                  "skill_matches":
                      skill_matches,

                  "country_matches":
                      country_matches,

                  "reasons":
                      reasons,

                  "concerns":
                      concerns
              })


          # ======================================
          # SORT
          # ======================================

          decision_order = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1
          }


          results.sort(

              key=lambda x: (

                  decision_order[
                      x["decision"]
                  ],

                  x["score"]
              ),

              reverse=True
          )


          # ======================================
          # PRINT ALL RESULTS
          # ======================================

          print("")
          print(
              "========================================"
          )

          print(
              "             RANKED JOBS"
          )

          print(
              "========================================"
          )


          for rank, item in enumerate(
              results,
              1
          ):

              job = item["job"]


              print("")

              print(
                  f"#{rank} "
                  f"{item['icon']} "
                  f"{item['score']}/100 "
                  f"- {item['decision']}"
              )


              print(
                  "JOB:",
                  job.get(
                      "title",
                      "Unknown"
                  )
              )


              print(
                  "COMPANY:",
                  job.get(
                      "company",
                      "Unknown"
                  )
              )


              print(
                  "LOCATION:",
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or "Unknown"
              )


              print(
                  "EXPERIENCE:",
                  job.get(
                      "experience",
                      "Not specified"
                  )
              )


              print(
                  "EXPERIENCE FIT:",
                  item["experience"]["level"]
              )


              print(
                  "WHY:",
                  "; ".join(
                      item["reasons"]
                  )
                  if item["reasons"]
                  else
                  item[
                      "experience"
                  ]["reason"]
              )


              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )


              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["role_matches"]
                  )
                  if item["role_matches"]
                  else "None"
              )


              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["education_matches"]
                  )
                  if item["education_matches"]
                  else "None"
              )


              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["skill_matches"]
                  )
                  if item["skill_matches"]
                  else "None"
              )


              print(
                  "URL:",
                  job.get(
                      "url"
                  )
                  or job.get(
                      "jobUrl"
                  )
                  or "No URL"
              )


              print(
                  "----------------------------------------"
              )


          # ======================================
          # SUMMARY
          # ======================================

          apply_now = sum(

              1

              for x in results

              if x["decision"]
              == "APPLY NOW"
          )


          apply_count = sum(

              1

              for x in results

              if x["decision"]
              == "APPLY"
          )


          review = sum(

              1

              for x in results

              if x["decision"]
              == "REVIEW"
          )


          low_priority = sum(

              1

              for x in results

              if x["decision"]
              == "LOW PRIORITY"
          )


          skip = sum(

              1

              for x in results

              if x["decision"]
              == "SKIP"
          )


          print("")

          print(
              "========================================"
          )

          print(
              "             FINAL SUMMARY"
          )

          print(
              "========================================"
          )


          print(
              "TOTAL JOBS:",
              len(results)
          )


          print(
              "🔥 APPLY NOW:",
              apply_now
          )


          print(
              "🟢 APPLY:",
              apply_count
          )


          print(
              "🟡 REVIEW:",
              review
          )


          print(
              "🟠 LOW PRIORITY:",
              low_priority
          )


          print(
              "🔴 SKIP:",
              skip
          )


          print("")

          print(
              "MAIN PRIORITY:"
          )

          print(
              "Fresh Graduate / Fresher / "
              "Entry Level / 0-1 / 0-2 years"
          )


          print("")

          print(
              "TARGET COUNTRIES:"
          )

          print(
              "Saudi Arabia | UAE | Qatar | "
              "Oman | Kuwait | Bahrain"
          )


          print(
              "========================================"
          )

          PY
