          import re


          # ========================================================
          # LOAD FILES
          # ========================================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          # ========================================================
          # PROFILE
          # ========================================================

          roles = [
              str(x).lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          skills = [
              str(x).lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          education = [
              str(x).lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


