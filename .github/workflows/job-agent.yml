name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. DOWNLOAD PROJECT
      # ============================================================
      - name: Download project
        uses: actions/checkout@v4


      # ============================================================
      # 2. FETCH JOBS FROM APIFY
      # ============================================================
      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import time
          import urllib.request
          import urllib.error


          # ========================================================
          # CONFIGURATION
          # ========================================================

          TOKEN = os.environ["APIFY_API_TOKEN"]

          BASE = "https://api.apify.com/v2"

          ACTOR = "blackfalcondata~naukrigulf-scraper"

          # Maximum time allowed for one Apify search
          MAX_RUN_SECONDS = 240

          # Maximum total scraping time
          MAX_TOTAL_SECONDS = 1200

          # Maximum results per search
          MAX_RESULTS = 15


          # ========================================================
          # SEARCHES
          # ========================================================

          searches = [

              # Saudi Arabia
              ("Saudi Arabia", "Chemical Engineer"),
              ("Saudi Arabia", "Process Engineer"),
              ("Saudi Arabia", "Production Engineer"),

              # United Arab Emirates
              ("United Arab Emirates", "Chemical Engineer"),
              ("United Arab Emirates", "Process Engineer"),
              ("United Arab Emirates", "Production Engineer"),

              # Qatar
              ("Qatar", "Chemical Engineer"),
              ("Qatar", "Process Engineer"),
              ("Qatar", "Production Engineer"),

              # Oman
              ("Oman", "Chemical Engineer"),
              ("Oman", "Process Engineer"),
              ("Oman", "Production Engineer"),

              # Kuwait
              ("Kuwait", "Chemical Engineer"),
              ("Kuwait", "Process Engineer"),
              ("Kuwait", "Production Engineer"),

              # Bahrain
              ("Bahrain", "Chemical Engineer"),
              ("Bahrain", "Process Engineer"),
              ("Bahrain", "Production Engineer")
          ]


          # ========================================================
          # API REQUEST
          # ========================================================

          def api_request(url, method="GET", payload=None, timeout=30):

              headers = {
                  "Authorization": "Bearer " + TOKEN
              }

              data = None

              if payload is not None:

                  data = json.dumps(payload).encode("utf-8")

                  headers["Content-Type"] = "application/json"

              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers
              )

              with urllib.request.urlopen(
                  request,
                  timeout=timeout
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ========================================================
          # START
          # ========================================================

          all_jobs = []

          workflow_start = time.time()

          successful_runs = 0

          failed_runs = 0


          # ========================================================
          # RUN ALL SEARCHES
          # ========================================================

          for index, (location, query) in enumerate(searches, 1):

              elapsed = time.time() - workflow_start

              if elapsed >= MAX_TOTAL_SECONDS:

                  print(
                      "GLOBAL FETCH TIME LIMIT REACHED"
                  )

                  break


              print("")
              print("=" * 70)

              print(
                  f"[{index}/{len(searches)}]"
              )

              print(
                  "SEARCH:",
                  query
              )

              print(
                  "LOCATION:",
                  location
              )

              print("=" * 70)


              # ----------------------------------------------------
              # ACTOR INPUT
              # ----------------------------------------------------

              payload = {

                  "mode": "search",

                  "query": query,

                  "location": location,

                  "maxResults": MAX_RESULTS,

                  "includeDetails": True,

                  "compact": False,

                  "excludeEmptyFields": True
              }


              start_url = (
                  BASE
                  + "/actors/"
                  + ACTOR
                  + "/runs"
              )


              # ----------------------------------------------------
              # START ACTOR
              # ----------------------------------------------------

              try:

                  result = api_request(
                      start_url,
                      method="POST",
                      payload=payload,
                      timeout=30
                  )

                  data = result.get(
                      "data",
                      {}
                  )

                  run_id = data.get(
                      "id"
                  )

                  dataset_id = data.get(
                      "defaultDatasetId"
                  )


                  if not run_id:

                      print(
                          "START FAILED: no run ID"
                      )

                      failed_runs += 1

                      continue


                  print(
                      "RUN:",
                      run_id
                  )


              except Exception as e:

                  print(
                      "START ERROR:",
                      str(e)
                  )

                  failed_runs += 1

                  continue


              # ----------------------------------------------------
              # POLLING
              # ----------------------------------------------------

              run_start = time.time()

              final_status = None


              while True:

                  elapsed_run = (
                      time.time()
                      - run_start
                  )


                  # -----------------------------------------------
                  # TIMEOUT
                  # -----------------------------------------------

                  if elapsed_run >= MAX_RUN_SECONDS:

                      print(
                          "RUN TIMEOUT:",
                          run_id
                      )


                      try:

                          abort_url = (
                              BASE
                              + "/actor-runs/"
                              + run_id
                              + "/abort"
                          )

                          api_request(
                              abort_url,
                              method="POST",
                              timeout=20
                          )

                          print(
                              "RUN ABORTED"
                          )


                      except Exception as e:

                          print(
                              "ABORT ERROR:",
                              str(e)
                          )


                      failed_runs += 1

                      break


                  # -----------------------------------------------
                  # CHECK STATUS
                  # -----------------------------------------------

                  try:

                      status_url = (
                          BASE
                          + "/actor-runs/"
                          + run_id
                          + "?waitForFinish=15"
                      )


                      result = api_request(
                          status_url,
                          timeout=25
                      )


                      data = result.get(
                          "data",
                          {}
                      )


                      status = data.get(
                          "status"
                      )


                      if data.get(
                          "defaultDatasetId"
                      ):

                          dataset_id = data.get(
                              "defaultDatasetId"
                          )


                      print(
                          "STATUS:",
                          status
                      )


                      # -------------------------------------------
                      # SUCCESS
                      # -------------------------------------------

                      if status == "SUCCEEDED":

                          final_status = status

                          successful_runs += 1

                          print(
                              "RUN SUCCEEDED"
                          )

                          break


                      # -------------------------------------------
                      # FAILURE
                      # -------------------------------------------

                      if status in [
                          "FAILED",
                          "ABORTED",
                          "TIMED-OUT"
                      ]:

                          final_status = status

                          failed_runs += 1

                          print(
                              "RUN FAILED:",
                              status
                          )

                          break


                  except Exception as e:

                      print(
                          "STATUS ERROR:",
                          str(e)
                      )


                  time.sleep(5)


              # ====================================================
              # SKIP FAILED RUN
              # ====================================================

              if final_status != "SUCCEEDED":

                  continue


              # ====================================================
              # DATASET
              # ====================================================

              if not dataset_id:

                  print(
                      "NO DATASET"
                  )

                  continue


              print(
                  "DOWNLOADING DATA..."
              )


              dataset_url = (
                  BASE
                  + "/datasets/"
                  + dataset_id
                  + "/items?format=json"
              )


              try:

                  result = api_request(
                      dataset_url,
                      timeout=60
                  )


                  if isinstance(
                      result,
                      list
                  ):

                      print(
                          "JOBS:",
                          len(result)
                      )

                      all_jobs.extend(
                          result
                      )


              except Exception as e:

                  print(
                      "DATASET ERROR:",
                      str(e)
                  )


          # ========================================================
          # DEDUPLICATION
          # ========================================================

          unique = {}


          for job in all_jobs:

              if not isinstance(
                  job,
                  dict
              ):

                  continue


              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              ).strip().lower()


              title = str(
                  job.get("title")
                  or ""
              ).strip().lower()


              company = str(
                  job.get("company")
                  or ""
              ).strip().lower()


              location = str(
                  job.get("location")
                  or ""
              ).strip().lower()


              if url:

                  key = url

              else:

                  key = (
                      title
                      + "|"
                      + company
                      + "|"
                      + location
                  )


              if key:

                  unique[key] = job


          jobs = list(
              unique.values()
          )


          # ========================================================
          # SAVE JOBS
          # ========================================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  jobs,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ========================================================
          # SUMMARY
          # ========================================================

          print("")
          print("=" * 70)

          print(
              "FETCH SUMMARY"
          )

          print(
              "SUCCESSFUL RUNS:",
              successful_runs
          )

          print(
              "FAILED / TIMEOUT RUNS:",
              failed_runs
          )

          print(
              "TOTAL UNIQUE JOBS:",
              len(jobs)
          )

          print("=" * 70)

          PY


      # ============================================================
      # 3. ANALYZE JOBS
      # ============================================================
      - name: Analyze jobs
        run: |

          python - <<'PY'

