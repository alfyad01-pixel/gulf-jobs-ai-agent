name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================

      - name: Download project
        uses: actions/checkout@v4


      # ==========================================
      # 2. FETCH GULF JOBS
      # ==========================================

      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

        run: |

          python - <<'PY'

          import json
          import os
          import urllib.request
          import urllib.error


          ACTOR_URL = (
              "https://api.apify.com/v2/actors/"
              "blackfalcondata~naukrigulf-scraper/"
              "run-sync-get-dataset-items"
          )


          # ======================================
          # SEARCH TERMS
          # ======================================

          searches = [

              # Saudi Arabia
              ("Chemical Engineer", "Saudi Arabia"),
              ("Junior Chemical Engineer", "Saudi Arabia"),
              ("Process Engineer", "Saudi Arabia"),
              ("Junior Process Engineer", "Saudi Arabia"),
              ("Production Engineer", "Saudi Arabia"),
              ("Production Operator", "Saudi Arabia"),
              ("Process Operator", "Saudi Arabia"),
              ("Petrochemical Engineer", "Saudi Arabia"),
              ("Operations Engineer", "Saudi Arabia"),
              ("Graduate Engineer", "Saudi Arabia"),
              ("Graduate Trainee", "Saudi Arabia"),

              # UAE
              ("Chemical Engineer", "United Arab Emirates"),
              ("Junior Chemical Engineer", "United Arab Emirates"),
              ("Process Engineer", "United Arab Emirates"),
              ("Junior Process Engineer", "United Arab Emirates"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Operator", "United Arab Emirates"),
              ("Process Operator", "United Arab Emirates"),
              ("Petrochemical Engineer", "United Arab Emirates"),
              ("Operations Engineer", "United Arab Emirates"),
              ("Graduate Engineer", "United Arab Emirates"),
              ("Graduate Trainee", "United Arab Emirates"),

              # Qatar
              ("Chemical Engineer", "Qatar"),
              ("Junior Chemical Engineer", "Qatar"),
              ("Process Engineer", "Qatar"),
              ("Junior Process Engineer", "Qatar"),
              ("Production Engineer", "Qatar"),
              ("Production Operator", "Qatar"),
              ("Process Operator", "Qatar"),
              ("Petrochemical Engineer", "Qatar"),
              ("Operations Engineer", "Qatar"),
              ("Graduate Engineer", "Qatar"),
              ("Graduate Trainee", "Qatar"),

              # Oman
              ("Chemical Engineer", "Oman"),
              ("Junior Chemical Engineer", "Oman"),
              ("Process Engineer", "Oman"),
              ("Junior Process Engineer", "Oman"),
              ("Production Engineer", "Oman"),
              ("Production Operator", "Oman"),
              ("Process Operator", "Oman"),
              ("Petrochemical Engineer", "Oman"),
              ("Operations Engineer", "Oman"),
              ("Graduate Engineer", "Oman"),
              ("Graduate Trainee", "Oman"),

              # Kuwait
              ("Chemical Engineer", "Kuwait"),
              ("Junior Chemical Engineer", "Kuwait"),
              ("Process Engineer", "Kuwait"),
              ("Junior Process Engineer", "Kuwait"),
              ("Production Engineer", "Kuwait"),
              ("Production Operator", "Kuwait"),
              ("Process Operator", "Kuwait"),
              ("Petrochemical Engineer", "Kuwait"),
              ("Operations Engineer", "Kuwait"),
              ("Graduate Engineer", "Kuwait"),
              ("Graduate Trainee", "Kuwait"),

              # Bahrain
              ("Chemical Engineer", "Bahrain"),
              ("Junior Chemical Engineer", "Bahrain"),
              ("Process Engineer", "Bahrain"),
              ("Junior Process Engineer", "Bahrain"),
              ("Production Engineer", "Bahrain"),
              ("Production Operator", "Bahrain"),
              ("Process Operator", "Bahrain"),
              ("Petrochemical Engineer", "Bahrain"),
              ("Operations Engineer", "Bahrain"),
              ("Graduate Engineer", "Bahrain"),
              ("Graduate Trainee", "Bahrain")
          ]


          all_jobs = []


          # ======================================
          # FETCH
          # ======================================

          for number, (query, location) in enumerate(
              searches,
              1
          ):

              print("")
              print(
                  f"[{number}/{len(searches)}] "
                  f"{query} - {location}"
              )

              payload = {
                  "mode": "search",
                  "query": query,
                  "location": location,

                  # Keep low to reduce timeout risk
                  "maxResults": 1,

                  "includeDetails": False,
                  "compact": True,
                  "excludeEmptyFields": True
              }


              request = urllib.request.Request(
                  ACTOR_URL,

                  data=json.dumps(
                      payload
                  ).encode("utf-8"),

                  method="POST",

                  headers={
                      "Content-Type":
                          "application/json",

                      "Authorization":
                          "Bearer "
                          + os.environ[
                              "APIFY_API_TOKEN"
                          ]
                  }
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=310
                  ) as response:

                      result = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )


                  if isinstance(result, list):

                      all_jobs.extend(result)

                      print(
                          "Received:",
                          len(result)
                      )

                  else:

                      print(
                          "No jobs returned"
                      )


              except urllib.error.HTTPError as e:

                  print(
                      "Search failed:",
                      query,
                      "-",
                      location
                  )

                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )


              except Exception as e:

                  print(
                      "Unexpected error:",
                      str(e)
                  )


          # ======================================
          # REMOVE DUPLICATES
          # ======================================

          unique = {}


          for job in all_jobs:

              key = (

                  job.get("url")

                  or job.get("jobUrl")

                  or (

                      str(
                          job.get(
                              "title",
                              ""
                          )
                      )
                      + "|"
                      +
                      str(
                          job.get(
                              "company",
                              ""
                          )
                      )
                      + "|"
                      +
                      str(
                          job.get(
                              "location",
                              ""
                          )
                      )
                  )
              )

              unique[key] = job


          # ======================================
          # SAVE
          # ======================================

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  list(unique.values()),
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("================================")
          print(
              "TOTAL UNIQUE JOBS:",
              len(unique)
          )
          print("================================")

          PY


      # ==========================================
      # 3. ANALYZE JOBS
      # ==========================================

      - name: Analyze jobs
        run: |

          echo "========================================"
          echo "        GULF JOBS AI AGENT"
          echo "        FRESH GRADUATE MODE"
          echo "================================"


          python - <<'PY'

          import json
          import re
          from urllib.parse import unquote


          # ======================================
          # LOAD DATA
          # ======================================

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:

              jobs = json.load(f)


          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:

              profile = json.load(f)


          roles = [
              str(x).lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]


          countries = [
              str(x).lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]


          education = [
              str(x).lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]


          skills = [
              str(x).lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]


          user_experience = float(
              profile.get(
                  "experience_years",
                  1
              )
          )


          # ======================================
          # CONVERT ANY VALUE TO TEXT
          # ======================================

          def value_to_text(value):

              if isinstance(value, list):

                  return " ".join(
                      str(x)
                      for x in value
                  )

              if isinstance(value, dict):

                  return " ".join(
                      str(v)
                      for v in value.values()
                  )

              return str(value)


          # ======================================
          # BUILD JOB TEXT
          # ======================================

          def build_job_text(job):

              parts = []

              for key, value in job.items():

                  parts.append(
                      value_to_text(value)
                  )

              return " ".join(
                  parts
              ).lower()


          # ======================================
          # EXTRACT EXPERIENCE FROM URL
          # ======================================

          def experience_from_url(job):

              url = str(
                  job.get("url")
                  or job.get("jobUrl")
                  or ""
              )

              url = unquote(
                  url
              ).lower()


              patterns = [

                  # 0-to-2-years
                  (
                      r"(\d+)[-_ ]*to[-_ ]*(\d+)"
                      r"[-_ ]*years?"
                  ),

                  # 0-2-years
                  (
                      r"(\d+)[-_ ]*[-to]+[-_ ]*"
                      r"(\d+)[-_ ]*years?"
                  ),

                  # 2-to-4-years
                  (
                      r"(\d+)[-_ ]*to[-_ ]*(\d+)"
                      r"[-_ ]*years"
                  ),

                  # 1-year
                  (
                      r"(\d+)[-_ ]*years?"
                  )
              ]


              for pattern in patterns:

                  match = re.search(
                      pattern,
                      url
                  )

                  if match:

                      groups = match.groups()


                      if len(groups) == 2:

                          low = int(
                              groups[0]
                          )

                          high = int(
                              groups[1]
                          )

                          return (
                              low,
                              high,
                              "URL"
                          )

                      if len(groups) == 1:

                          low = int(
                              groups[0]
                          )

                          return (
                              low,
                              low,
                              "URL"
                          )


              return None


          # ======================================
          # EXTRACT EXPERIENCE FROM TEXT
          # ======================================

          def experience_from_text(text):

              patterns = [

                  # 0-2 years
                  (
                      r"\b(\d+)\s*[-–]\s*(\d+)"
                      r"\s*(?:years?|yrs?)\b"
                  ),

                  # 0 to 2 years
                  (
                      r"\b(\d+)\s*to\s*(\d+)"
                      r"\s*(?:years?|yrs?)\b"
                  ),

                  # 0+ years
                  (
                      r"\b(\d+)\s*\+\s*"
                      r"(?:years?|yrs?)\b"
                  ),

                  # minimum 2 years
                  (
                      r"(?:minimum|min\.?|at least)"
                      r"\s*(\d+)\s*"
                      r"(?:years?|yrs?)"
                  )
              ]


              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text
                  )

                  if match:

                      groups = match.groups()


                      if len(groups) == 2:

                          return (
                              int(groups[0]),
                              int(groups[1]),
                              "TEXT"
                          )


                      if len(groups) == 1:

                          value = int(
                              groups[0]
                          )

                          return (
                              value,
                              value,
                              "TEXT"
                          )


              return None


          # ======================================
          # ANALYZE EXPERIENCE
          # ======================================

          def analyze_experience(
              job,
              text
          ):

              # ------------------------------
              # Fresh graduate keywords
              # ------------------------------

              fresh_keywords = [

                  "fresh graduate",
                  "fresh graduates",
                  "fresher",
                  "freshers",
                  "entry level",
                  "entry-level",
                  "graduate trainee",
                  "graduate engineer",
                  "graduate program",
                  "graduate programme",
                  "trainee engineer",
                  "new graduate",
                  "recent graduate",
                  "no experience",
                  "without experience",
                  "zero experience",
                  "no prior experience",
                  "0 years experience",
                  "0 year experience"
              ]


              for keyword in fresh_keywords:

                  if keyword in text:

                      return {

                          "low": 0,

                          "high": 0,

                          "points": 40,

                          "level":
                              "FRESH GRADUATE",

                          "reason":
                              "Explicitly suitable for fresh graduates",

                          "source":
                              "keyword"
                      }


              # ------------------------------
              # URL first
              # ------------------------------

              exp = experience_from_url(
                  job
              )


              # ------------------------------
              # Text second
              # ------------------------------

              if not exp:

                  exp = experience_from_text(
                      text
                  )


              # ------------------------------
              # No experience found
              # ------------------------------

              if not exp:

                  return {

                      "low": None,

                      "high": None,

                      "points": 25,

                      "level":
                          "NOT SPECIFIED",

                      "reason":
                          "Experience not specified",

                      "source":
                          "none"
                  }


              low, high, source = exp


              # ------------------------------
              # 0-0
              # ------------------------------

              if high == 0:

                  return {

                      "low": low,

                      "high": high,

                      "points": 40,

                      "level":
                          "NO EXPERIENCE",

                      "reason":
                          "No experience required",

                      "source":
                          source
                  }


              # ------------------------------
              # 0-1
              # ------------------------------

              if low == 0 and high <= 1:

                  return {

                      "low": low,

                      "high": high,

                      "points": 40,

                      "level":
                          "EXCELLENT FIT",

                      "reason":
                          "0-1 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 0-2
              # ------------------------------

              if low == 0 and high <= 2:

                  return {

                      "low": low,

                      "high": high,

                      "points": 38,

                      "level":
                          "EXCELLENT FIT",

                      "reason":
                          "0-2 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 1-2
              # ------------------------------

              if low <= 1 and high <= 2:

                  return {

                      "low": low,

                      "high": high,

                      "points": 35,

                      "level":
                          "VERY GOOD FIT",

                      "reason":
                          "1-2 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 1-3
              # ------------------------------

              if low <= 1 and high <= 3:

                  return {

                      "low": low,

                      "high": high,

                      "points": 30,

                      "level":
                          "GOOD FIT",

                      "reason":
                          "Up to 3 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 2-3
              # ------------------------------

              if low <= 2 and high <= 3:

                  return {

                      "low": low,

                      "high": high,

                      "points": 22,

                      "level":
                          "POSSIBLE",

                      "reason":
                          "2-3 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 2-4
              # ------------------------------

              if low <= 2 and high <= 4:

                  return {

                      "low": low,

                      "high": high,

                      "points": 15,

                      "level":
                          "LOW FIT",

                      "reason":
                          "2-4 years",

                      "source":
                          source
                  }


              # ------------------------------
              # 3-5
              # ------------------------------

              if low >= 3 and high <= 5:

                  return {

                      "low": low,

                      "high": high,

                      "points": 5,

                      "level":
                          "NOT SUITABLE",

                      "reason":
                          "Requires 3+ years",

                      "source":
                          source
                  }


              # ------------------------------
              # 5+
              # ------------------------------

              if low >= 5:

                  return {

                      "low": low,

                      "high": high,

                      "points": 0,

                      "level":
                          "NOT SUITABLE",

                      "reason":
                          "Requires 5+ years",

                      "source":
                          source
                  }


              return {

                  "low": low,

                  "high": high,

                  "points": 8,

                  "level":
                      "LOW FIT",

                  "reason":
                      "Experience above target",

                  "source":
                      source
              }


          # ======================================
          # ROLE MATCH
          # ======================================

          def analyze_role(title):

              title = title.lower()


              exact = []


              for role in roles:

                  if role in title:

                      exact.append(
                          role
                      )


              if exact:

                  return 25, exact


              useful = [

                  "chemical",
                  "process",
                  "production",
                  "petrochemical",
                  "operator",
                  "operations"
              ]


              matches = [

                  x

                  for x in useful

                  if x in title
              ]


              if matches:

                  return 15, matches


              return 0, []


          # ======================================
          # SENIOR CHECK
          # ======================================

          def senior_job(title, text):

              senior_words = [

                  "senior",
                  "lead engineer",
                  "principal engineer",
                  "chief engineer",
                  "engineering manager",
                  "project manager",
                  "department manager",
                  "manager - engineering",
                  "supervisor"
              ]


              for word in senior_words:

                  if word in title:

                      return True


              # Only inspect text for strong
              # senior phrases

              strong = [

                  "minimum 5 years",
                  "minimum 7 years",
                  "minimum 10 years",
                  "5+ years",
                  "7+ years",
                  "10+ years"
              ]


              return any(
                  word in text
                  for word in strong
              )


          # ======================================
          # ANALYSIS
          # ======================================

          results = []


          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )


              text = build_job_text(
                  job
              )


              exp = analyze_experience(
                  job,
                  text
              )


              role_points, role_matches = (
                  analyze_role(
                      title
                  )
              )


              # ------------------------------
              # Education
              # ------------------------------

              education_matches = []


              for item in education:

                  if item in text:

                      education_matches.append(
                          item
                      )


              education_points = 15 if (
                  education_matches
              ) else 0


              # ------------------------------
              # Skills
              # ------------------------------

              skill_matches = []


              for skill in skills:

                  if skill in text:

                      skill_matches.append(
                          skill
                      )


              skill_points = min(

                  15,

                  len(
                      skill_matches
                  ) * 3
              )


              # ------------------------------
              # Country
              # ------------------------------

              country_matches = []


              for country in countries:

                  if country in text:

                      country_matches.append(
                          country
                      )


              country_points = 5 if (
                  country_matches
              ) else 0


              # ------------------------------
              # Junior / graduate title bonus
              # ------------------------------

              title_bonus = 0


              junior_words = [

                  "junior",
                  "graduate",
                  "trainee",
                  "entry level",
                  "entry-level",
                  "assistant",
                  "operator"
              ]


              if any(
                  word in title.lower()
                  for word in junior_words
              ):

                  title_bonus = 5


              # ------------------------------
              # Fresh graduate bonus
              # ------------------------------

              fresh_bonus = 0


              if (
                  exp["level"]
                  in [
                      "FRESH GRADUATE",
                      "NO EXPERIENCE",
                      "EXCELLENT FIT"
                  ]
              ):

                  fresh_bonus = 5


              # ------------------------------
              # Final score
              # ------------------------------

              score = (

                  exp["points"]

                  + role_points

                  + education_points

                  + skill_points

                  + country_points

                  + title_bonus

                  + fresh_bonus
              )


              score = min(
                  100,
                  score
              )


              # ------------------------------
              # Senior override
              # ------------------------------

              is_senior = senior_job(
                  title,
                  text
              )


              if is_senior:

                  decision = "SKIP"

                  score = min(
                      score,
                      35
                  )


              elif exp["points"] <= 5:

                  decision = "SKIP"


              elif score >= 80:

                  decision = "APPLY NOW"


              elif score >= 70:

                  decision = "APPLY"


              elif score >= 55:

                  decision = "REVIEW"


              elif score >= 40:

                  decision = "LOW PRIORITY"


              else:

                  decision = "SKIP"


              # ------------------------------
              # Reasons
              # ------------------------------

              reasons = []


              if exp["level"] in [

                  "FRESH GRADUATE",
                  "NO EXPERIENCE",
                  "EXCELLENT FIT",
                  "VERY GOOD FIT"
              ]:

                  reasons.append(
                      exp["reason"]
                  )


              if role_points >= 25:

                  reasons.append(
                      "Target role matches"
                  )

              elif role_points >= 15:

                  reasons.append(
                      "Related engineering/operations role"
                  )


              if education_matches:

                  reasons.append(
                      "Education matches"
                  )


              if skill_matches:

                  reasons.append(

                      f"{len(skill_matches)} "
                      "matching skills"
                  )


              # ------------------------------
              # Concerns
              # ------------------------------

              concerns = []


              if exp["level"] in [

                  "LOW FIT",
                  "NOT SUITABLE"
              ]:

                  concerns.append(
                      exp["reason"]
                  )


              if exp["level"] == "NOT SPECIFIED":

                  concerns.append(
                      "Experience must be verified"
                  )


              if not education_matches:

                  concerns.append(
                      "Education match not confirmed"
                  )


              if not skill_matches:

                  concerns.append(
                      "Few matching skills"
                  )


              if is_senior:

                  concerns.append(
                      "Senior/lead/management position"
                  )


              results.append({

                  "score":
                      score,

                  "decision":
                      decision,

                  "job":
                      job,

                  "experience":
                      exp,

                  "role_matches":
                      role_matches,

                  "education_matches":
                      education_matches,

                  "skill_matches":
                      skill_matches,

                  "country_matches":
                      country_matches,

                  "reasons":
                      reasons,

                  "concerns":
                      concerns
              })


          # ======================================
          # SORT
          # ======================================

          decision_order = {

              "APPLY NOW": 5,

              "APPLY": 4,

              "REVIEW": 3,

              "LOW PRIORITY": 2,

              "SKIP": 1
          }


          results.sort(

              key=lambda x: (

                  decision_order[
                      x["decision"]
                  ],

                  x["score"]
              ),

              reverse=True
          )


          # ======================================
          # PRINT RANKED JOBS
          # ======================================

          print("")
          print(
              "========================================"
          )

          print(
              "             RANKED JOBS"
          )

          print(
              "========================================"
          )


          for rank, item in enumerate(
              results,
              1
          ):

              job = item["job"]


              print("")

              print(
                  f"#{rank} "
                  f"{item['score']}/100 "
                  f"- {item['decision']}"
              )


              print(
                  "JOB:",
                  job.get(
                      "title",
                      "Unknown"
                  )
              )


              print(
                  "COMPANY:",
                  job.get(
                      "company",
                      "Unknown"
                  )
              )


              print(
                  "LOCATION:",
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or "Unknown"
              )


              # Experience display

              exp = item[
                  "experience"
              ]


              if exp["low"] is not None:

                  if (
                      exp["low"]
                      == exp["high"]
                  ):

                      exp_display = (
                          f"{exp['low']} years"
                      )

                  else:

                      exp_display = (

                          f"{exp['low']}-"
                          f"{exp['high']} years"
                      )

              else:

                  exp_display = (
                      "Not specified"
                  )


              print(
                  "EXPERIENCE:",
                  exp_display
              )


              print(
                  "EXPERIENCE FIT:",
                  exp["level"]
              )


              print(
                  "EXPERIENCE SOURCE:",
                  exp["source"]
              )


              print(
                  "WHY:",
                  "; ".join(
                      item["reasons"]
                  )
                  if item["reasons"]
                  else "None"
              )


              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )


              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["role_matches"]
                  )
                  if item["role_matches"]
                  else "None"
              )


              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["education_matches"]
                  )
                  if item["education_matches"]
                  else "None"
              )


              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["skill_matches"]
                  )
                  if item["skill_matches"]
                  else "None"
              )


              print(
                  "URL:",
                  job.get("url")
                  or job.get("jobUrl")
                  or "No URL"
              )


              print(
                  "----------------------------------------"
              )


          # ======================================
          # SUMMARY
          # ======================================

          apply_now = sum(
              1
              for x in results
              if x["decision"]
              == "APPLY NOW"
