name: Gulf Jobs AI Agent

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Istanbul"

  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Fetch Gulf jobs from Apify
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          actor_url = (
              "https://api.apify.com/v2/actors/"
              "blackfalcondata~naukrigulf-scraper/"
              "run-sync-get-dataset-items"
          )

          searches = [
              ("Chemical Engineer", "Saudi Arabia"),
              ("Chemical Engineer", "United Arab Emirates"),
              ("Chemical Engineer", "Qatar"),
              ("Process Engineer", "Saudi Arabia"),
              ("Process Engineer", "United Arab Emirates"),
              ("Process Engineer", "Qatar"),
              ("Production Engineer", "Saudi Arabia"),
              ("Production Engineer", "United Arab Emirates"),
              ("Production Engineer", "Qatar")
          ]

          all_jobs = []

          for query, location in searches:
              print(f"Searching: {query} - {location}")

              payload = {
                  "mode": "search",
                  "query": query,
                  "location": location,
                  "maxResults": 2,
                  "includeDetails": False,
                  "compact": True,
                  "excludeEmptyFields": True
              }

              request = urllib.request.Request(
                  actor_url,
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Authorization":
                          "Bearer " + os.environ["APIFY_API_TOKEN"]
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=300
                  ) as response:

                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  if isinstance(result, list):
                      all_jobs.extend(result)

              except urllib.error.HTTPError as e:
                  print(
                      f"Search failed: "
                      f"{query} - {location}"
                  )
                  print(
                      e.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

              except Exception as e:
                  print(
                      f"Unexpected error: "
                      f"{query} - {location}"
                  )
                  print(str(e))

          # Remove duplicates
          unique = {}

          for job in all_jobs:

              key = (
                  job.get("url")
                  or job.get("jobUrl")
                  or (
                      str(job.get("title", "")) +
                      "|" +
                      str(job.get("company", "")) +
                      "|" +
                      str(job.get("location", ""))
                  )
              )

              unique[key] = job

          with open(
              "jobs.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  list(unique.values()),
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              f"Total unique jobs: {len(unique)}"
          )

          PY

      - name: Analyze jobs
        run: |
          echo "========================================"
          echo "       GULF JOBS AI AGENT"
          echo "       FRESH GRADUATE MODE"
          echo "========================================"

          python - <<'PY'
          import json
          import re

          with open(
              "jobs.json",
              "r",
              encoding="utf-8"
          ) as f:
              jobs = json.load(f)

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as f:
              profile = json.load(f)

          roles = [
              x.lower()
              for x in profile.get(
                  "target_roles",
                  []
              )
          ]

          countries = [
              x.lower()
              for x in profile.get(
                  "target_countries",
                  []
              )
          ]

          education = [
              x.lower()
              for x in profile.get(
                  "education",
                  []
              )
          ]

          skills = [
              x.lower()
              for x in profile.get(
                  "skills",
                  []
              )
          ]

          experience_years = profile.get(
              "experience_years",
              0
          )

          # --------------------------------
          # Helper functions
          # --------------------------------

          def job_text(job):

              fields = [
                  "title",
                  "description",
                  "descriptionText",
                  "experience",
                  "requirements",
                  "skills",
                  "location",
                  "country"
              ]

              parts = []

              for field in fields:

                  value = job.get(
                      field,
                      ""
                  )

                  if isinstance(
                      value,
                      list
                  ):

                      parts.extend(
                          str(x)
                          for x in value
                      )

                  else:
                      parts.append(
                          str(value)
                      )

              return " ".join(
                  parts
              ).lower()

          def detect_experience(text):

              # Strong fresh graduate indicators
              fresh_terms = [
                  "fresh graduate",
                  "fresh graduates",
                  "fresh graduate engineer",
                  "fresher",
                  "freshers",
                  "entry level",
                  "entry-level",
                  "graduate trainee",
                  "graduate engineer",
                  "trainee engineer",
                  "new graduate",
                  "recent graduate",
                  "no experience",
                  "without experience",
                  "0 years",
                  "0 year",
                  "0-1 year",
                  "0-1 years",
                  "0 - 1 year",
                  "0 - 1 years",
                  "0-2 years",
                  "0 - 2 years",
                  "0 to 2 years"
              ]

              for term in fresh_terms:

                  if term in text:

                      return {
                          "score": 30,
                          "level": "FRESH GRADUATE",
                          "reason":
                              "Suitable for fresh graduates / 0-2 years"
                      }

              # 1 year experience
              one_year_terms = [
                  "1 year",
                  "1+ year",
                  "1+ years",
                  "1-2 years",
                  "1 - 2 years",
                  "1 to 2 years"
              ]

              for term in one_year_terms:

                  if term in text:

                      return {
                          "score": 28,
                          "level": "EXCELLENT FIT",
                          "reason":
                              "Experience requirement fits your 1 year"
                      }

              # 2-3 years
              if (
                  "2-3 years" in text
                  or "2 - 3 years" in text
                  or "2 to 3 years" in text
              ):

                  return {
                      "score": 20,
                      "level": "POSSIBLE",
                      "reason":
                          "Slightly above your experience"
                  }

              # 2-4 years
              if (
                  "2-4 years" in text
                  or "2 - 4 years" in text
                  or "2 to 4 years" in text
              ):

                  return {
                      "score": 14,
                      "level": "POSSIBLE",
                      "reason":
                          "Requires more experience than your profile"
                  }

              # 3+ years
              patterns = [
                  r"3\+ years",
                  r"4\+ years",
                  r"5\+ years",
                  r"6\+ years",
                  r"7\+ years",
                  r"8\+ years",
                  r"10\+ years"
              ]

              for pattern in patterns:

                  if re.search(
                      pattern,
                      text
                  ):

                      return {
                          "score": 3,
                          "level": "LOW FIT",
                          "reason":
                              "Requires significant experience"
                      }

              # Senior positions
              senior_terms = [
                  "senior",
                  "lead engineer",
                  "principal engineer",
                  "engineering manager",
                  "project manager",
                  "department manager",
                  "supervisor",
                  "head of"
              ]

              for term in senior_terms:

                  if term in text:

                      return {
                          "score": 0,
                          "level": "NOT SUITABLE",
                          "reason":
                              "Senior/management position"
                      }

              # No experience information
              return {
                  "score": 18,
                  "level": "UNKNOWN",
                  "reason":
                      "Experience requirement not clearly stated"
              }

          def role_score(title):

              title = title.lower()

              exact = []

              for role in roles:

                  if role in title:

                      exact.append(
                          role
                      )

              if exact:

                  return 25, exact

              engineering_words = [
                  "chemical",
                  "process",
                  "production",
                  "petrochemical",
                  "operator"
              ]

              if any(
                  word in title
                  for word in engineering_words
              ):

                  return 12, []

              return 0, []

          # --------------------------------
          # Score jobs
          # --------------------------------

          results = []

          for job in jobs:

              title = str(
                  job.get(
                      "title",
                      ""
                  )
              )

              company = str(
                  job.get(
                      "company",
                      ""
                  )
              )

              location = str(
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or ""
              )

              text = job_text(
                  job
              )

              # 1. ROLE = 25
              role_points, role_matches = (
                  role_score(title)
              )

              # 2. EDUCATION = 20
              education_matches = []

              for item in education:

                  if item in text:

                      education_matches.append(
                          item
                      )

              education_points = (
                  20
                  if education_matches
                  else 0
              )

              # 3. EXPERIENCE = 30
              experience = detect_experience(
                  text
              )

              experience_points = (
                  experience["score"]
              )

              # 4. SKILLS = 15
              skill_matches = []

              for skill in skills:

                  if skill in text:

                      skill_matches.append(
                          skill
                      )

              skill_points = min(
                  15,
                  len(skill_matches) * 3
              )

              # 5. COUNTRY = 10
              country_matches = []

              for country in countries:

                  if country in text:

                      country_matches.append(
                          country
                      )

              country_points = (
                  10
                  if country_matches
                  else 0
              )

              # --------------------------------
              # Final score
              # --------------------------------

              total = min(
                  100,
                  role_points
                  + education_points
                  + experience_points
                  + skill_points
                  + country_points
              )

              # --------------------------------
              # Practical decision
              # --------------------------------

              if (
                  experience["level"]
                  == "NOT SUITABLE"
              ):

                  decision = "SKIP"
                  icon = "🔴"

              elif total >= 80:

                  decision = "APPLY NOW"
                  icon = "🔥"

              elif total >= 70:

                  decision = "APPLY"
                  icon = "🟢"

              elif total >= 60:

                  decision = "REVIEW"
                  icon = "🟡"

              elif total >= 45:

                  decision = "LOW PRIORITY"
                  icon = "🟠"

              else:

                  decision = "SKIP"
                  icon = "🔴"

              # --------------------------------
              # Why
              # --------------------------------

              reasons = []

              if role_points >= 25:
                  reasons.append(
                      "Target role matches"
                  )

              if education_points:
                  reasons.append(
                      "Education matches"
                  )

              if experience_points >= 28:
                  reasons.append(
                      "Excellent for 0-2 years"
                  )

              elif experience_points >= 20:
                  reasons.append(
                      "Experience is close to your profile"
                  )

              if skill_matches:
                  reasons.append(
                      f"{len(skill_matches)} matching skills"
                  )

              if country_points:
                  reasons.append(
                      "Gulf country"
                  )

              # --------------------------------
              # Concerns
              # --------------------------------

              concerns = []

              if experience_points <= 14:

                  concerns.append(
                      "Experience requirement may be high"
                  )

              if not education_matches:

                  concerns.append(
                      "Education requirement not clearly matched"
                  )

              if not skill_matches:

                  concerns.append(
                      "Few matching skills found"
                  )

              if (
                  "english" in text
                  and "english" not in skills
              ):

                  concerns.append(
                      "English requirement mentioned"
                  )

              results.append({
                  "score": total,
                  "decision": decision,
                  "icon": icon,
                  "job": job,
                  "role_matches": role_matches,
                  "education_matches":
                      education_matches,
                  "skill_matches":
                      skill_matches,
                  "country_matches":
                      country_matches,
                  "experience":
                      experience,
                  "reasons":
                      reasons,
                  "concerns":
                      concerns
              })

          # --------------------------------
          # Sort best jobs first
          # --------------------------------

          results.sort(
              key=lambda x: (
                  x["decision"] == "APPLY NOW",
                  x["decision"] == "APPLY",
                  x["score"]
              ),
              reverse=True
          )

          # --------------------------------
          # Print ALL jobs
          # --------------------------------

          print("")
          print("========================================")
          print("             RANKED JOBS")
          print("========================================")

          for rank, item in enumerate(
              results,
              1
          ):

              job = item["job"]

              print("")
              print(
                  f"#{rank} "
                  f"{item['icon']} "
                  f"{item['score']}/100 "
                  f"- {item['decision']}"
              )

              print(
                  "JOB:",
                  job.get(
                      "title",
                      "Unknown"
                  )
              )

              print(
                  "COMPANY:",
                  job.get(
                      "company",
                      "Unknown"
                  )
              )

              print(
                  "LOCATION:",
                  job.get(
                      "location"
                  )
                  or job.get(
                      "country"
                  )
                  or "Unknown"
              )

              print(
                  "EXPERIENCE:",
                  job.get(
                      "experience",
                      "Not specified"
                  )
              )

              print(
                  "EXPERIENCE FIT:",
                  item["experience"]["level"]
              )

              print(
                  "WHY:",
                  "; ".join(
                      item["reasons"]
                  )
                  if item["reasons"]
                  else "Limited match"
              )

              print(
                  "CONCERNS:",
                  "; ".join(
                      item["concerns"]
                  )
                  if item["concerns"]
                  else "None"
              )

              print(
                  "ROLE MATCH:",
                  ", ".join(
                      item["role_matches"]
                  )
                  if item["role_matches"]
                  else "None"
              )

              print(
                  "EDUCATION MATCH:",
                  ", ".join(
                      item["education_matches"]
                  )
                  if item["education_matches"]
                  else "None"
              )

              print(
                  "SKILLS MATCH:",
                  ", ".join(
                      item["skill_matches"]
                  )
                  if item["skill_matches"]
                  else "None"
              )

              print(
                  "COUNTRY MATCH:",
                  ", ".join(
                      item["country_matches"]
                  )
                  if item["country_matches"]
                  else "None"
              )

              print(
                  "URL:",
                  job.get("url")
                  or job.get("jobUrl")
                  or "No URL"
              )

              print("----------------------------------------")

          # --------------------------------
          # Summary
          # --------------------------------

          apply_now = sum(
              1
              for x in results
              if x["decision"]
              == "APPLY NOW"
          )

          apply = sum(
              1
              for x in results
              if x["decision"]
              == "APPLY"
          )

          review = sum(
              1
              for x in results
              if x["decision"]
              == "REVIEW"
          )

          skip = sum(
              1
              for x in results
              if x["decision"]
              == "SKIP"
          )

          print("")
          print("========================================")
          print("              FINAL SUMMARY")
          print("========================================")

          print(
              "TOTAL JOBS:",
              len(results)
          )

          print(
              "🔥 APPLY NOW:",
              apply_now
          )

          print(
              "🟢 APPLY:",
              apply
          )

          print(
              "🟡 REVIEW:",
              review
          )

          print(
              "🔴 SKIP:",
              skip
          )

          print("")
          print(
              "Priority: Fresh Graduate / "
              "0-1 / 0-2 years"
          )

          print(
              "Target: Chemical / Process / "
              "Production / Petrochemical"
          )

          print("========================================")

          PY
