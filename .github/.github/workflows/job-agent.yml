name: Gulf Jobs AI Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "jobs.json"
      - "profile.json"

jobs:
  analyze-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Analyze jobs
        run: |
          echo "================================"
          echo "      GULF JOBS AI AGENT"
          echo "================================"
          echo ""

          echo "PROFILE:"
          cat profile.json

          echo ""
          echo "================================"
          echo "JOBS:"
          cat jobs.json

          echo ""
          echo "================================"
          echo "MATCH ANALYSIS"
          echo "================================"

          python - <<'PY'
          import json

          with open("jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          with open("profile.json", "r", encoding="utf-8") as f:
              profile = json.load(f)

          skills = set(x.lower() for x in profile["skills"])

          for job in jobs:
              requirements = set(
                  x.lower() for x in job.get("requirements", [])
              )

              matches = skills.intersection(requirements)

              score = round(
                  (len(matches) / max(len(requirements), 1)) * 100
              )

              print("")
              print("JOB:", job["title"])
              print("COMPANY:", job["company"])
              print("COUNTRY:", job["country"])
              print("MATCH SCORE:", str(score) + "/100")
              print("MATCHED SKILLS:", ", ".join(matches) if matches else "None")
              print("--------------------------------")
          PY
